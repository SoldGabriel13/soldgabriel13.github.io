<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
        name="IPA Reader"
        content="It transforms the IPA text into a phoneme string computable by klattsch, then it uses the klattsch engine with expanded phoneme inventory"
      />
    <title>Lexicon</title>
    <link rel="icon" type="image/png" href="/icons/favicon.png" />

    <style>
        :root {
            --main-green: #2e7d32;
            --light-green: #a5d6a7;
            --bg: #f4fdf6;
            --text: #1b1b1b;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: var(--main-green);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }

        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 1rem;
        }

        #ipa {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid var(--light-green);
            border-radius: 10px;
            font-size: 1rem;
        }



        /* ─── play button ────────────────────────────────────────────────── */
        .play-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.7rem;
            padding: 0.35rem 0.85rem 0.35rem 0.6rem;
            border: 2px solid var(--main-green);
            border-radius: 999px;
            background: transparent;
            color: var(--main-green);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }

        .play-btn:hover {
            background: var(--main-green);
            color: white;
        }

        .play-btn:active {
            transform: scale(0.94);
        }

        .play-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .play-btn.playing {
            background: var(--main-green);
            color: white;
            animation: pulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.4);
            }
            100% {
                box-shadow: 0 0 0 6px rgba(46, 125, 50, 0);
            }
        }

        .status {
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: #4a4a4a;
            min-height: 1.2em;
        }

        .status.error {
            color: #c62828;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.9rem;
            font-size: 0.85rem;
            color: var(--text);
        }

        .speed-control input[type="range"] {
            accent-color: var(--main-green);
            width: 220px;
        }

        .speed-control output {
            font-variant-numeric: tabular-nums;
            min-width: 3.2em;
            font-weight: 600;
            color: var(--main-green);
        }

    </style>
</head>
<body>
    <header>
        <h1>IPA player</h1>
    </header>
    <main>
        <div class="controls">
            <input id="ipa" value="he.'lo͡ʊ 'ðɛ.ɚ || ðɪs ɪs 'kʊɫ" placeholder="IPA text" />
        </div>
        <button id="playBtn" class="play-btn">Play</button>
        <div class="speed-control">
            <label for="speed">Pace</label>
            <input id="speed" type="range" min="0.5" max="2.5" step="0.05" value="1" />
            <output id="speedValue" for="speed">1.00×</output>
        </div>
        <div class="speed-control">
            <label for="glideSpeed">Glide speed</label>
            <input id="glideSpeed" type="range" min="0.5" max="2.5" step="0.05" value="1" />
            <output id="glideSpeedValue" for="glideSpeed">1.00×</output>
        </div>
        <div class="speed-control">
            <label for="tobiEnabled"><input id="tobiEnabled" type="checkbox" /> ToBI prosody</label>
        </div>
        <div class="speed-control" id="tobiRow" style="display:none;">
            <label for="tobi">Tones</label>
            <input id="tobi" type="text" placeholder="H* L-L% | H* L-H%"
                   style="flex:1; padding:0.4rem; border:2px solid var(--light-green); border-radius:8px;" />
        </div>
        <div class="speed-control">
            <label for="phonemicEnabled"><input id="phonemicEnabled" type="checkbox" /> Phonemic mode</label>
        </div>
        <div id="phonemicRows" style="display:none;">
            <div class="controls">
                <label for="phonemic" style="font-size:0.85rem; display:block; margin-bottom:0.2rem;">/ phonemes /</label>
                <input id="phonemic" placeholder="p a t a" />
            </div>
            <div class="controls">
                <label for="soundChanges" style="font-size:0.85rem; display:block; margin-bottom:0.2rem;">sound changes (one rule per line)</label>
                <textarea id="soundChanges" rows="4" placeholder="T > D / V_V&#10;h > Ø / V_V"
                          style="width:100%; padding:0.9rem; border:2px solid var(--light-green); border-radius:10px; font-size:1rem; box-sizing:border-box;"></textarea>
            </div>
        </div>
        <p id="status" class="status"></p>
    </main>
    <script type="module" src="src/main.js?v=0.5.0"></script>
    <script type="module">
        // NOTE: this assumes a global `speak(phonemeString)` function is already
        // provided elsewhere in the app (e.g. loaded by src/main.js), which takes
        // phoneme codes from bundled.js separated by spaces (e.g. "HH EH L O")
        // and synthesizes/plays the audio. If that's not the case yet, replace
        // the call inside playIpa() below with whatever your synth entry point is.
        import { bundled } from './src/engine/banks/bundled.js';

        const DATASET_NAME = 'ipa-soldgabriel-2026';
        const phonemeDefs = bundled[DATASET_NAME].phonemes;

        // Build a map of IPA symbol -> phoneme code (e.g. "ʂ" -> "SS").
        // Most entries only carry the symbol inside "example": "[ʂ]"; a few
        // also have an explicit "ipa" field, which takes precedence.
        // Symbols are stored NFD-normalized so precomposed accented letters
        // (e.g. "ă") and combining-mark sequences (e.g. "a" + breve) line up.
        function buildIpaMap() {
            const map = new Map();
            for (const [code, def] of Object.entries(phonemeDefs)) {
                let symbol = def.ipa;
                if (!symbol && def.example) {
                    const match = def.example.match(/\[(.+)\]/);
                    if (match) symbol = match[1];
                }
                if (symbol) {
                    const key = symbol.normalize('NFD');
                    if (map.has(key)) {
                        // Data bug in bundled.js: two phonemes share the same
                        // example symbol, so the second one silently makes the
                        // first unreachable from typed IPA. Surface it loudly
                        // instead of swallowing it -- e.g. LFN and LNFN both
                        // currently claim "[ã]".
                        console.warn(
                            `IPA symbol "${symbol}" is claimed by both ${map.get(key)} and ${code} in bundled.js; ` +
                            `${code} wins and ${map.get(key)} is now unreachable from typed IPA.`
                        );
                    }
                    map.set(key, code);
                }
            }
            return map;
        }

        const ipaMap = buildIpaMap();

        // Explicit override: the plain letter "r" (IPA alveolar trill) is not
        // looked up in bundled.js at all — it's always realized as a
        // multi-tap flap sequence.
        ipaMap.set('r', '( DX DX DX DX )');
        ipaMap.set('ʰ', 'r-60 ( H ) r+60');
        ipaMap.set('ʲ', 'r-60 ( J ) r+60');
        ipaMap.set('ʷ', 'r-60 ( W ) r+60');
        ipaMap.set('ˠ', 'r-60 ( VELR ) r+60');

        // Longest symbols first, so multi-character symbols (affricates like
        // "t͡ʃ", nasalized vowels like "ɑ̃") are matched before their parts.
        const symbolsByLength = [...ipaMap.keys()].sort((a, b) => b.length - a.length);

        // Diacritics that wrap the most recently emitted phoneme code as
        // "{prefix} {code} {closer}".
        const WRAP_DIACRITICS = {
            '\u02D0': { prefix: 'r220', closer: 'r' }, // ː  long
            ':': { prefix: 'r220', closer: 'r' },      // :  ASCII stand-in for ː
            '\u02D1': { prefix: 'r165', closer: 'r' }, // ˑ  half-long
            '\u0306': { prefix: 'r70', closer: 'r' },  // ̆  extra-short (combining breve)
            '\u0324': { prefix: 'h0.9', closer: 'h' }, // ̤  breathy voice (combining diaeresis below)
        };

        // Boundary marks: emitted as standalone tokens, not tied to a phoneme.
        // '\u2197' (rising arrow) and '\u2193' (downstep arrow) piggyback on
        // this same mechanism: they don't wrap a phoneme, they just drop a
        // prosody directive into the stream at that point, which OVERRIDES
        // whatever contour/register was already in effect from there on.
        const BOUNDARY_TOKENS = {
            '|': ',', // minor (foot) boundary
            '\u2016': '.', // ‖ major (intonation) boundary
            '\u2197': '[contour=rise]', // ↗ forces a rising contour for the rest of the clause
            '\u2193': 'b-20', // ↓ downstep: permanent register step-down from here on
        };

        // Combining tone diacritics that wrap the LAST emitted code, same
        // mechanism as WRAP_DIACRITICS above (length marks etc.) — level
        // tones use a symmetric pitch bump that's undone right after, so
        // they never leave a lasting shift on what follows; á/à/ā are
        // level tones (high/low/mid), â/ǎ are contour tones (a real glide
        // within that one syllable, not just a level shift).
        const TONE_STEP = 12; // Hz per Chao tone-level step, used everywhere below
        const TONE_WRAP_DIACRITICS = {
            '\u0301': { prefix: `b+${TONE_STEP * 2}`, closer: `b-${TONE_STEP * 2}` }, // á high tone
            '\u0300': { prefix: `b-${TONE_STEP * 2}`, closer: `b+${TONE_STEP * 2}` }, // à low tone
            '\u0304': null, // ā mid/level tone -- reference level, no shift needed
        };
        // Contour (glide) tone diacritics: only cleanly representable as a
        // real within-syllable pitch glide when the code they're attached
        // to hasn't already been wrapped by something else (see comment at
        // its use below); falls back to a level-shift approximation
        // otherwise, which still sounds directionally right even if it's
        // not a true glide.
        const CONTOUR_TONE_DIACRITICS = {
            '\u0302': -TONE_STEP * 3, // â circumflex: falling contour (high -> low)
            '\u030C': TONE_STEP * 3,  // ǎ caron: rising contour (low -> high)
        };

        // Chao tone-letter levels (˥˦˧˨˩ = 5..1, high to low). These are
        // PREFIX marks in this app's convention (e.g. "˦a"), unlike the
        // combining marks above which are suffixes (e.g. "á"). A run of
        // several in a row (e.g. "˧˦˧a") describes a multi-point contour
        // across the syllable, not just its start and end.
        const TONE_LEVELS = {
            '\u02E5': 5, '\u02E6': 4, '\u02E7': 3, '\u02E8': 2, '\u02E9': 1,
        };

        // Stress marks: wrap an entire "." separated segment as
        // "{prefix} b+1 {segment} r b".
        const STRESS_WRAPS = {
            '\u02C8': { prefix: 'r150' }, // ˈ primary stress
            "'": { prefix: 'r150' },      // ' ASCII stand-in for ˈ
            '\u02CC': { prefix: 'r125' }, // ˌ secondary stress
        };

        // Tie bar: links two adjacent symbols into one glide, e.g. affricate
        // "t͡ʃ" or diphthong "a͡ʊ" (symbol + U+0361 + symbol). U+035C (tie
        // bar placed below instead of above) is the same thing typographically
        // and is treated identically. Maps straight onto the sequencer's
        // "[glideTo]" directive: the first symbol glides toward the second.
        const TIE_BAR_CHARS = new Set(['\u0361', '\u035C']);

        function matchSymbolAt(text, pos) {
            for (const symbol of symbolsByLength) {
                if (text.startsWith(symbol, pos)) return symbol;
            }
            return null;
        }

        function wrapLastCode(codes, prefix, closer) {
            if (codes.length === 0) return false;
            codes[codes.length - 1] = `${prefix} ${codes[codes.length - 1]} ${closer}`;
            return true;
        }

        // Builds one combined token for a run of Chao tone levels (e.g.
        // [3,4,3] for "˧˦˧") applied to a base phoneme code. Each level
        // becomes one repetition of the base code, grouped into a syllable
        // "( ... )" so they share a single syllable's time slot instead of
        // sounding like separate extra sounds; a sticky delta between
        // consecutive repetitions carries the pitch from one level to the
        // next. A trailing directive (outside the group, so it's silent)
        // undoes the total drift so the contour never leaks into whatever
        // comes after it.
        function buildToneContour(levels, baseCode) {
            const offsets = levels.map(L => (L - 3) * TONE_STEP);
            const parts = offsets.map((off, i) => {
                const step = i === 0 ? off : off - offsets[i - 1];
                if (step === 0) return baseCode;
                return `${baseCode}${step > 0 ? '+' : ''}${step}`;
            });
            const net = offsets[offsets.length - 1];
            const correction = net === 0 ? '' : ` b${net > 0 ? '-' : '+'}${Math.abs(net)}`;
            return `( ${parts.join(' ')} )${correction}`;
        }

        // Tokenizes a single (already dot-split) chunk of IPA text into an
        // array of phoneme-code tokens. Does not know about "." or stress
        // marks — those are handled per-segment by ipaToPhonemeString.
        function tokenizeSegment(text) {
            const codes = [];
            const unmatched = [];
            let i = 0;

            outer:
            while (i < text.length) {
                const ch = text[i];

                if (/\s/.test(ch)) {
                    i++;
                    continue;
                }

                if (ch in WRAP_DIACRITICS) {
                    const { prefix, closer } = WRAP_DIACRITICS[ch];
                    if (!wrapLastCode(codes, prefix, closer)) unmatched.push(ch);
                    i++;
                    continue;
                }

                // Suffix level tones: á/à/ā. Symmetric bump-and-undo, so a
                // level tone shifts just that one syllable's register and
                // never leaks into what follows.
                if (ch in TONE_WRAP_DIACRITICS) {
                    const wrap = TONE_WRAP_DIACRITICS[ch];
                    if (wrap) {
                        if (!wrapLastCode(codes, wrap.prefix, wrap.closer)) unmatched.push(ch);
                    } else if (codes.length === 0) {
                        unmatched.push(ch); // ā (mid) with nothing to attach to
                    }
                    i++;
                    continue;
                }

                // Suffix contour tones: â (falling) / ǎ (rising). When the
                // last code is still bare (no earlier diacritic has wrapped
                // it) this rewrites it as a real transient pitch glide
                // within that one phoneme, e.g. "AA" -> "AA(-36)" — the
                // most accurate representation. If something already
                // wrapped it (e.g. a preceding length mark), a true glide
                // can no longer be spliced into the middle of that string
                // safely, so this falls back to a symmetric register-shift
                // wrap instead — directionally right, just not a true glide.
                if (ch in CONTOUR_TONE_DIACRITICS) {
                    const delta = CONTOUR_TONE_DIACRITICS[ch];
                    if (codes.length === 0) {
                        unmatched.push(ch);
                    } else if (/^[A-Z]+$/.test(codes[codes.length - 1])) {
                        codes[codes.length - 1] += `(${delta > 0 ? '+' : ''}${delta})`;
                    } else {
                        wrapLastCode(codes, `b${delta > 0 ? '+' : ''}${delta}`, `b${delta > 0 ? '-' : '+'}${Math.abs(delta)}`);
                    }
                    i++;
                    continue;
                }

                if (ch in BOUNDARY_TOKENS) {
                    codes.push(BOUNDARY_TOKENS[ch]);
                    i++;
                    continue;
                }

                // Tie bar: "t͡ʃ" / "a͡ʊ" etc. -- glide the preceding symbol
                // toward whatever symbol follows the tie mark.
                if (TIE_BAR_CHARS.has(ch)) {
                    const nextSymbol = matchSymbolAt(text, i + 1);
                    if (codes.length === 0 || !nextSymbol) {
                        unmatched.push(ch);
                        i++;
                        continue;
                    }
                    const nextCode = ipaMap.get(nextSymbol);
                    const lastCode = codes[codes.length - 1];
                    // Only safe to tie when the preceding code is still a
                    // single bare phoneme token (possibly with its own
                    // inline pitch suffix from a tone mark, e.g. "AA(-36)")
                    // -- [glideTo] must directly follow one phoneme and be
                    // directly followed by one phoneme (see sequencer.js).
                    // If something earlier (a length mark, etc.) already
                    // wrapped it into a multi-token string, tying it here
                    // would break that adjacency, so both symbols are kept
                    // as separate, non-glide-linked sounds instead --
                    // audible either way, just not glide-joined.
                    if (/^[A-Z]+(\([+-]?\d+(?:\.\d+)?\)|[+-]?\d+(?:\.\d+)?)?$/.test(lastCode)) {
                        codes[codes.length - 1] = `${lastCode} [glideTo] ${nextCode}`;
                    } else {
                        codes.push(nextCode);
                    }
                    i += 1 + nextSymbol.length;
                    continue;
                }

                // Prefix Chao tone letters: ˦a (one level) or ˧˦˧a (a
                // multi-point contour) — consume the whole run of tone-level
                // characters, then require a base symbol immediately after
                // it. With no base symbol to attach to, the run is invalid
                // and reported as unmatched rather than silently dropped.
                if (ch in TONE_LEVELS) {
                    let j = i;
                    const levels = [];
                    while (j < text.length && text[j] in TONE_LEVELS) {
                        levels.push(TONE_LEVELS[text[j]]);
                        j++;
                    }
                    let matchedSymbol = null;
                    for (const symbol of symbolsByLength) {
                        if (text.startsWith(symbol, j)) { matchedSymbol = symbol; break; }
                    }
                    if (matchedSymbol) {
                        const baseCode = ipaMap.get(matchedSymbol);
                        if (levels.length === 1) {
                            const off = (levels[0] - 3) * TONE_STEP;
                            codes.push(off === 0 ? baseCode : `b${off > 0 ? '+' : ''}${off} ${baseCode} b${off > 0 ? '-' : '+'}${Math.abs(off)}`);
                        } else {
                            codes.push(buildToneContour(levels, baseCode));
                        }
                        i = j + matchedSymbol.length;
                    } else {
                        for (const c of text.slice(i, j)) unmatched.push(c);
                        i = j;
                    }
                    continue;
                }

                for (const symbol of symbolsByLength) {
                    if (text.startsWith(symbol, i)) {
                        codes.push(ipaMap.get(symbol));
                        i += symbol.length;
                        continue outer;
                    }
                }
                unmatched.push(ch);
                i++;
            }

            return { codes, unmatched };
        }

        function wrapSegment(joinedCodes, stress) {
            if (stress) {
                return `${stress.prefix} b+1 ${joinedCodes} r b`;
            }
            return `r100 ${joinedCodes} r`;
        }

        // Splits a word into stress-annotated chunks. Both "." and any
        // stress mark (ˈ/'/ˌ) act as boundaries — a stress mark doesn't
        // need to be preceded by "." to start a new chunk (so "meˈnĩ" splits
        // into "me" and a ˈ-stressed "nĩ" even without a dot between them).
        // "." carries no stress; a stress mark carries its own stress onto
        // whatever text follows it, until the next boundary.
        function splitWordIntoChunks(rawWord) {
            const chunks = [];
            let start = 0;
            let stress = null;

            const flush = (end) => {
                const text = rawWord.slice(start, end).trim();
                if (text) chunks.push({ text, stress });
            };

            for (let i = 0; i < rawWord.length; i++) {
                const ch = rawWord[i];
                if (ch === '.') {
                    flush(i);
                    start = i + 1;
                    stress = null;
                } else if (ch in STRESS_WRAPS) {
                    flush(i);
                    start = i + 1;
                    stress = STRESS_WRAPS[ch];
                }
            }
            flush(rawWord.length);

            return chunks;
        }

        // Same work as processWord below, but returns each chunk separately
        // (with its stressed flag) instead of joining them into one string.
        // processWord is now just a thin wrapper around this -- identical
        // output, just also used directly by the ToBI mapper, which needs
        // to find individual stressed chunks to attach pitch accents to.
        function processWordStructured(rawWord) {
            const chunks = splitWordIntoChunks(rawWord);
            const result = [];
            const unmatched = [];

            for (const { text, stress } of chunks) {
                const { codes, unmatched: chunkUnmatched } = tokenizeSegment(text);
                unmatched.push(...chunkUnmatched);
                if (codes.length === 0) continue;
                result.push({ stressed: !!stress, output: wrapSegment(codes.join(' '), stress) });
            }

            return { chunks: result, unmatched };
        }

        // Processes one whitespace-delimited word: splits it into
        // stress-annotated chunks (see splitWordIntoChunks), tokenizes each,
        // and wraps it — stressed chunks as "{prefix} b+1 {chunk} r b",
        // every other chunk in the word as "r100 {chunk} r".
        function processWord(rawWord) {
            const { chunks, unmatched } = processWordStructured(rawWord);
            return { output: chunks.map(c => c.output).join(' '), unmatched };
        }

        // Same splitting as ipaToPhonemeString, but returns one flat list of
        // chunks across the whole phrase (not joined into a string) --
        // what the ToBI mapper needs to walk stressed syllables in order.
        function ipaPhraseToChunks(rawIpa) {
            const text = rawIpa
                .normalize('NFD')
                .trim()
                .replace(/^[\[\/]+|[\]\/]+$/g, '');

            const words = text.split(/\s+/).filter(Boolean);
            const allChunks = [];
            const unmatched = [];

            for (const rawWord of words) {
                const { chunks, unmatched: wordUnmatched } = processWordStructured(rawWord);
                unmatched.push(...wordUnmatched);
                allChunks.push(...chunks);
            }

            return { chunks: allChunks, unmatched };
        }

        // Turns raw IPA text into a bundled.js phoneme code string. Text is
        // split into words (by whitespace), and each word into "." separated
        // segments — the "." is only a splitting aid and never appears in
        // the rendered output itself. Within each word, a stressed segment
        // is wrapped as "{prefix} b+1 {segment} r b"; every other segment in
        // that word is wrapped as "r100 {segment} r".
        // e.g. "ˈka.mĩ.ɲu suave" ->
        //   "r150 b+1 K AA r b r100 M IN r r100 U r r100 SS UW AA V EH r"
        // Returns { phonemeString, unmatched }.
        function ipaToPhonemeString(rawIpa) {
            const text = rawIpa
                .normalize('NFD')
                .trim()
                .replace(/^[\[\/]+|[\]\/]+$/g, ''); // drop surrounding [ ] or / /

            const words = text.split(/\s+/).filter(Boolean);
            const wordOutputs = [];
            const unmatched = [];

            for (const rawWord of words) {
                const { output, unmatched: wordUnmatched } = processWord(rawWord);
                unmatched.push(...wordUnmatched);
                if (output) wordOutputs.push(output);
            }

            return { phonemeString: wordOutputs.join(' '), unmatched };
        }


        // --- Phonemic mode: sound-change rule engine ------------------------
        // Auto-classifies IPA phonemes by articulatory features (place,
        // manner, voice, height, backness) into the natural classes below,
        // then applies an ordered list of generative sound-change rules
        // (TARGET > OUTPUT / LEFT_RIGHT, with ! for exceptions) to a
        // phonemic input string. The result is treated as an allophonic
        // transcription and run through the normal pronunciation pipeline.
        //
        // Supported: literal segments, natural classes (A-Z per the table
        // below), Ø (delete/insert), X0 (copy the matched segment
        // unchanged), stress-marked classes (acute or apostrophe prefix,
        // e.g. ´V/'V = stressed vowel), #/$/% boundaries (# is
        // auto-inserted at word edges), a single level of "(X)" for
        // zero-or-more, and one "!" exception clause per rule.
        // Feature-changing output (a bare class letter, e.g. "T > D")
        // picks the class member closest in place/manner to the matched
        // input segment.
        //
        // NOT implemented (see conversation): Xn/Xx (nth/all of a
        // sequence), tone marking, X̣ as a general modifier (use the
        // literal retroflex IPA character instead), nested parentheses.
// --- Phoneme feature table for the auto-classifier -------------------------
        // --- Phonemic mode: sound-change rule engine ------------------------
        // Auto-classifies IPA phonemes by articulatory features (place,
        // manner, voice, height, backness) into the natural classes below,
        // then applies an ordered list of generative sound-change rules
        // (TARGET > OUTPUT, optionally "/ LEFT_RIGHT", with ! for

// --- Phoneme feature table (unchanged from before) -------------------------

// --- Segmentation ------------------------------------------------------
const CLASS_LETTERS = new Set('ABCDEFHJKLMNOPQRSTUVWZ'.split(''));
const BOUNDARY_CHARS = new Set(['#', '$', '%']);
// Stress prefix marks: ˈ (IPA), ' (ascii stand-in), ” (as given by the user).
// Combining acute (0301) is handled separately as a SUFFIX mark (V́ / ´V).
const STRESS_PREFIX = new Set(['\u02C8', "'", '\u201D', '\u00B4']);
const NASAL_PREFIX = '~';

function isCombining(ch) {
  return ch && /\p{Mn}/u.test(ch) && ch !== TIE;
}

function segmentPhonemic(text) {
  const t = text.normalize('NFD');
  const segments = [];
  let i = 0;
  let pendingStress = false;
  while (i < t.length) {
    const ch = t[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (BOUNDARY_CHARS.has(ch)) { segments.push({ text: ch, boundary: ch, stressed: false }); i++; continue; }
    if (STRESS_PREFIX.has(ch)) { pendingStress = true; i++; continue; }
    if (ch === '\u0301' && segments.length === 0) { pendingStress = true; i++; continue; } // stray leading acute
    if (i >= t.length) break;
    let seg = t[i]; i++;
    while (i < t.length) {
      if (t[i] === TIE) {
        seg += t[i]; i++;
        if (i < t.length) { seg += t[i]; i++; }
      } else if (t[i] === '\u0301') { pendingStress = true; i++; } // suffix acute = stress (V́)
      else if (isCombining(t[i])) { seg += t[i]; i++; }
      else break;
    }
    segments.push({ text: seg.normalize('NFC'), boundary: null, stressed: pendingStress });
    pendingStress = false;
  }
  return segments;
}

function baseOf(segText) {
  return segText.normalize('NFD').replace(/[\u0300-\u036F]/g, m => (m === TIE ? m : '')).normalize('NFC');
}
function segIsNasal(seg) {
  return !seg.boundary && seg.text.normalize('NFD').includes('\u0303');
}
function segMatchesClass(seg, letter) {
  if (seg.boundary) return false;
  return classesOf(baseOf(seg.text)).has(letter);
}

// --- Shared atom parsing -----------------------------------------------
// One "atom" = an optional stress mark (prefix ´/'/”, or suffix combining
// acute), an optional nasal mark (prefix ~, suffix combining tilde, or a
// bracket [+nas]/[-nas] suffix), and a base: a class letter, Ø, X0, or a
// literal IPA run (which may itself be a {a,b,c} alternation set).
// Returns { kind: 'null'|'copy'|'class'|'literal'|'alt', ... }.
function parseAtom(raw) {
  let s = raw.trim();
  if (s === 'Ø') return { kind: 'null' };
  if (s === 'X0') return { kind: 'copy' };

  let stressed, nasal;
  while (s.length && (STRESS_PREFIX.has(s[0]))) { stressed = true; s = s.slice(1); }
  while (s.length && s[0] === NASAL_PREFIX) { nasal = true; s = s.slice(1); }

  const bracketM = s.match(/^(.*)\[([+-])nas\]$/);
  if (bracketM) { s = bracketM[1]; nasal = bracketM[2] === '+'; }

  // {a,b,c} alternation set -- each option parsed recursively
  if (s.startsWith('{') && s.endsWith('}')) {
    const options = s.slice(1, -1).split(',').map(o => parseAtom(o.trim()));
    return { kind: 'alt', options, stressed, nasal };
  }

  let nfd = s.normalize('NFD');
  while (nfd.length > 1) {
    const last = nfd[nfd.length - 1];
    if (last === '\u0301') { stressed = true; nfd = nfd.slice(0, -1); }
    else if (last === '\u0303') { nasal = true; nfd = nfd.slice(0, -1); }
    else break;
  }
  s = nfd.normalize('NFC');

  if (s.length === 1 && CLASS_LETTERS.has(s)) return { kind: 'class', letter: s, stressed, nasal };
  const segs = segmentPhonemic(s);
  return { kind: 'literal', text: segs.map(x => x.text).join(''), stressed, nasal };
}

function atomToMatcher(atom) {
  if (atom.kind === 'null') return { type: 'null' };
  if (atom.kind === 'copy') return { type: 'literal', text: 'X0' }; // X0 as a bare target isn't meaningful; treat literally
  if (atom.kind === 'alt') return { type: 'altGroup', options: atom.options.map(atomToMatcher) };
  if (atom.kind === 'class') return { type: 'class', letter: atom.letter, stressed: atom.stressed, nasal: atom.nasal };
  return { type: 'literal', text: atom.text, stressed: atom.stressed, nasal: atom.nasal };
}

function atomToOutput(atom) {
  if (atom.kind === 'null') return { type: 'null' };
  if (atom.kind === 'copy') return { type: 'copy' };
  if (atom.kind === 'alt') return atomToOutput(atom.options[0]); // deterministic: first alternative
  if (atom.nasal !== undefined) return { type: 'featureToggle', nasal: atom.nasal };
  if (atom.kind === 'class') return { type: 'class', letter: atom.letter };
  return { type: 'literal', text: atom.text };
}



// Parses one side of a rule's environment (left or right of "_") into a
// list of matcher objects: class letters (optionally stress/nasal-marked),
// literal IPA text, {a,b,c} alternation, # $ % boundaries, and a single
// level of "(X)" for zero-or-more X.
function parseEnvSide(spec) {
  const s = spec.normalize('NFD');
  const matchers = [];
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === '(') {
      const close = findMatchingParen(s, i);
      if (close === -1) throw new Error(`unmatched "(" in environment "${spec}"`);
      const inner = parseEnvSide(s.slice(i + 1, close));
      matchers.push({ type: 'optional', inner });
      i = close + 1;
      continue;
    }
    if (BOUNDARY_CHARS.has(ch)) { matchers.push({ type: 'boundary', char: ch }); i++; continue; }
    if (ch === '\u00D8' || ch === 'Ø') { i++; continue; } // "nothing"
    if (ch === '{') {
      const close = s.indexOf('}', i);
      if (close === -1) throw new Error(`unmatched "{" in environment "${spec}"`);
      const atom = parseAtom(s.slice(i, close + 1).normalize('NFC'));
      matchers.push(atomToMatcher(atom));
      i = close + 1;
      continue;
    }
    // one atom: optional prefix marks + base (+ combining suffixes, tie)
    const { atomText, next } = consumeAtomSpan(s, i);
    const atom = parseAtom(atomText.normalize('NFC'));
    matchers.push(atomToMatcher(atom));
    i = next;
  }
  return matchers;
}

function findMatchingParen(s, openIdx) {
  let depth = 0;
  for (let i = openIdx; i < s.length; i++) {
    if (s[i] === '(') depth++;
    else if (s[i] === ')') { depth--; if (depth === 0) return i; }
  }
  return -1;
}

// Consumes one atom's raw text span starting at i: prefix stress/nasal
// marks, one base char, then any tie-linked char / combining diacritics.
function consumeAtomSpan(s, i) {
  const STRESS_PREFIX = new Set(['\u02C8', "'", '\u201D', '\u00B4']);
  const TIE = '\u0361';
  let start = i;
  while (i < s.length && STRESS_PREFIX.has(s[i])) i++;
  while (i < s.length && s[i] === '~') i++;
  if (i >= s.length) return { atomText: s.slice(start, i), next: i };
  i++; // base char
  while (i < s.length) {
    if (s[i] === TIE) { i++; if (i < s.length) i++; }
    else if (/\p{Mn}/u.test(s[i])) i++;
    else break;
  }
  // trailing bracket feature suffix
  if (s.slice(i, i + 6) === '[+nas]' || s.slice(i, i + 6) === '[-nas]') i += 6;
  return { atomText: s.slice(start, i), next: i };
}

function matchOneSeg(seg, matcher) {
  if (matcher.type === 'boundary') return seg.boundary === matcher.char;
  if (matcher.type === 'altGroup') return matcher.options.some(opt => matchOneSeg(seg, opt));
  if (matcher.type === 'literal') {
    if (seg.boundary || seg.text !== matcher.text) return false;
    if (matcher.nasal !== undefined && segIsNasal(seg) !== matcher.nasal) return false;
    return true;
  }
  if (matcher.type === 'class') {
    if (seg.boundary) return false;
    if (matcher.stressed && !seg.stressed) return false;
    if (matcher.nasal !== undefined && segIsNasal(seg) !== matcher.nasal) return false;
    return segMatchesClass(seg, matcher.letter);
  }
  return false;
}

function matchSide(segments, startIdx, matchers) {
  function tryFrom(mIdx, sIdx) {
    if (mIdx >= matchers.length) return true;
    const m = matchers[mIdx];
    if (m.type === 'optional') {
      const tryCounts = [sIdx];
      let cur = sIdx;
      while (cur < segments.length && matchOneSeg(segments[cur], m.inner[0])) {
        cur++;
        tryCounts.push(cur);
      }
      for (let k = tryCounts.length - 1; k >= 0; k--) {
        if (tryFrom(mIdx + 1, tryCounts[k])) return true;
      }
      return false;
    }
    if (sIdx >= segments.length) return false;
    if (!matchOneSeg(segments[sIdx], m)) return false;
    return tryFrom(mIdx + 1, sIdx + 1);
  }
  return tryFrom(0, startIdx);
}



const ARROW_RE = /\u2192|->/g; // → and -> both normalize to >

function parseRule(line, warnings) {
  let raw = line.replace(ARROW_RE, '>');

  raw = raw.replace(/\([a-zA-Z][a-zA-Z \-]*\)\s*$/, m => /[øØ#$%]/.test(m) ? m : '').trim();

  const bangSplit = raw.split('!');

  const m = main.match(/^(.+?)>(.+?)(?:\/(.+))?$/);
  if (!m) {
    if (/^[A-Z]0[A-Z]0/.test(main.trim()) || /^C0C0/.test(main.trim())) {
      warnings.push(`Sound change: "${line}" uses a repeated-identical-segment target (like V0V0 or C0C0), which needs backreference matching across TWO segments -- not supported (see conversation: this is a different complexity tier from the rest of the notation)`);
    } else {
      warnings.push(`Sound change: couldn't parse rule "${line}" (expected TARGET > OUTPUT, optionally with / LEFT_RIGHT)`);
    }
    return null;
  }
  const [targetRaw, outputRaw, envRawOrUndef] = m.slice(1).map(s => (s !== undefined ? s.trim() : s));
  const envRaw = envRawOrUndef ?? ''; // no "/" at all -- rule applies unconditionally, everywhere

  const hasEnv = envRawOrUndef !== undefined;

  let stressCondition = null;
  if (hasEnv && /^stressed$/i.test(envRaw)) stressCondition = true;
  else if (hasEnv && /^unstressed$/i.test(envRaw)) stressCondition = false;

  let leftMatchers = [], rightMatchers = [], exceptionLeft = null, exceptionRight = null;
  if (!hasEnv) {
    // no "/" at all: rule applies unconditionally, everywhere (empty
    // matcher lists trivially match any context)
  } else if (stressCondition === null) {
    const envParts = envRaw.split('_');
    if (envParts.length !== 2) { warnings.push(`Sound change: environment in "${line}" needs exactly one "_" (or the word "stressed"/"unstressed")`); return null; }
    try {
      leftMatchers = parseEnvSide(envParts[0].trim()).reverse();
      rightMatchers = parseEnvSide(envParts[1].trim());
    } catch (e) { warnings.push(`Sound change: ${e.message} in rule "${line}"`); return null; }
  }
  if (exceptionSpec) {
    const exParts = exceptionSpec.split('_');
    if (exParts.length === 2) {
      try {
        exceptionLeft = parseEnvSide(exParts[0].trim()).reverse();
        exceptionRight = parseEnvSide(exParts[1].trim());
      } catch (e) { warnings.push(`Sound change: exception clause error in "${line}": ${e.message}`); }
    } else {
      warnings.push(`Sound change: exception clause in "${line}" isn't a LEFT_RIGHT environment or is a feature-comparison form ("! C2 = L") that isn't supported -- ignoring the exception, rule applies unconditionally`);

  const target = atomToMatcher(parseAtom(targetRaw));
  const output = atomToOutput(parseAtom(outputRaw));

  return { raw: line, target, output, left: leftMatchers, right: rightMatchers, exceptionLeft, exceptionRight, stressCondition };
}

function nearestInClass(letter, matchedBase) {
  const inFeat = PHONEME_FEATURES[matchedBase] || {};
  let best = null, bestScore = -1;

    if (!classesOf(sym).has(letter)) continue;
    const f = PHONEME_FEATURES[sym];
    let score = 0;
    if (f.place && inFeat.place && f.place === inFeat.place) score += 2;
    if (f.manner && inFeat.manner && f.manner === inFeat.manner) score += 1;
    if (f.backness && inFeat.backness && f.backness === inFeat.backness) score += 2;
    if (f.height && inFeat.height && f.height === inFeat.height) score += 1;
    if (score > bestScore) { bestScore = score; best = sym; }

}

function resolveOutput(output, matchedSeg, warnings) {
  if (output.type === 'null') return '';
  if (output.type === 'copy') return matchedSeg ? matchedSeg.text : '';
  if (output.type === 'featureToggle') {
    if (!matchedSeg) { warnings.push('Sound change: feature-toggle output needs a matched segment'); return ''; }
    let t = matchedSeg.text.normalize('NFD');
    if (output.nasal === true) { if (!t.includes('\u0303')) t += '\u0303'; }
    else if (output.nasal === false) t = t.replace(/\u0303/g, '');
    return t.normalize('NFC');

  if (output.type === 'literal') return output.text;
  if (output.type === 'class') {
    const base = matchedSeg ? baseOf(matchedSeg.text) : null;
    if (base && classesOf(base).has(output.letter)) return base; // already a member: no change needed
    const sym = nearestInClass(output.letter, base);
    if (!sym) { warnings.push(`Sound change: no known phoneme for output class "${output.letter}"`); return matchedSeg ? matchedSeg.text : ''; }
    return sym;
  }
  return matchedSeg ? matchedSeg.text : '';
}

function targetMatches(seg, target, stressCondition) {

    return true;

    if (seg.boundary) return false;
    if (target.stressed && !seg.stressed) return false;
    if (target.nasal !== undefined && segIsNasal(seg) !== target.nasal) return false;
    return classesOf(baseOf(seg.text)).has(target.letter);
  }
  return false;
}

function envMatchesAt(segments, i, left, right) {
  const before = segments.slice(0, i).reverse();
  const after = segments.slice(i + 1);
  return matchSide(before, 0, left) && matchSide(after, 0, right);
}

function applyRule(segments, rule, warnings) {
  const out = [];
  if (rule.target.type === 'null') {
    for (let i = 0; i <= segments.length; i++) {
      const before = segments.slice(0, i).reverse();
      const after = segments.slice(i);
      const envOk = matchSide(before, 0, rule.left) && matchSide(after, 0, rule.right);
      const excluded = envOk && rule.exceptionLeft &&
        matchSide(before, 0, rule.exceptionLeft) && matchSide(after, 0, rule.exceptionRight);
      if (envOk && !excluded) {
        const text = resolveOutput(rule.output, null, warnings);
        if (text) out.push({ text, boundary: null, stressed: false });
      }
      if (i < segments.length) out.push(segments[i]);
    }
    return out;
  }

  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    if (targetMatches(seg, rule.target, rule.stressCondition)) {
      const envOk = rule.stressCondition !== null ? true : envMatchesAt(segments, i, rule.left, rule.right);
      const excluded = envOk && rule.exceptionLeft &&
        envMatchesAt(segments, i, rule.exceptionLeft, rule.exceptionRight);
      if (envOk && !excluded) {
        const text = resolveOutput(rule.output, seg, warnings);
        if (text) out.push({ text, boundary: null, stressed: seg.stressed });
        continue;
      }
    }
    out.push(seg);
  }
  return out;
}

function withAutoWordBoundaries(text) {
  return '# ' + text.trim().replace(/\s+/g, ' # ') + ' #';
}

function applySoundChanges(phonemicText, rulesText) {
  const warnings = [];
  let segments = segmentPhonemic(withAutoWordBoundaries(phonemicText));
  const lines = rulesText.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('//'));
  for (const line of lines) {
    const rule = parseRule(line, warnings);
    if (!rule) continue;
    segments = applyRule(segments, rule, warnings);
  }
  const resultText = segments.filter(s => !s.boundary)
    .map(s => (s.stressed ? '\u02C8' : '') + s.text)
    .join(' ');
  return { result: resultText, warnings };
}

// --- Prosody/dynamics markup (extIPA-style bracketed spans) --------
        // [{𝆑 ... 𝆑}] forte (loud), [{𝆑𝆑 ... 𝆑𝆑}] fortissimo (very loud),
        // [{𝆏 ... 𝆏}] piano (quiet), [{𝆏𝆏 ... 𝆏𝆏}] pianissimo (very quiet),
        // [{allegro ... allegro}] fast, [{lento ... lento}] slow, and a
        // standalone "(N second pause)" for an explicit silence. Loudness
        // maps to the synth's `gain` param at roughly +/-6dB and +/-12dB per
        // step (amp ratio = 10^(dB/20)); tempo maps to `localSpeed`, which
        // MULTIPLIES whatever the Pace slider is already doing rather than
        // overriding it, per how sequencer.js's localSpeed is designed.
        const PROSODY_MARKERS = {
            '𝆑𝆑': { gain: 4.0 },      // fortissimo, +12dB
            '𝆑':  { gain: 2.0 },      // forte, +6dB
            '𝆏𝆏': { gain: 0.25 },     // pianissimo, -12dB
            '𝆏':  { gain: 0.5 },      // piano, -6dB
            allegro: { localSpeed: 1.4 },
            lento:   { localSpeed: 0.7 },
        };
        // Longest/most-specific keys first so "𝆑𝆑" is tried before "𝆑" --
        // same longest-match-first principle used for IPA symbols above.
        const PROSODY_MARKER_RE = new RegExp(
            '\\[\\{(' + Object.keys(PROSODY_MARKERS).sort((a, b) => b.length - a.length).map(k =>
                k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            ).join('|') + ')\\s+([\\s\\S]*?)\\s+\\1\\}\\]',
            'g'
        );
        const PAUSE_RE = /\((\d+(?:\.\d+)?)\s*seconds?\s*pause\)/gi;

        // Handles a plain span of text that may still contain standalone
        // "(N second pause)" markers, converting everything else through
        // the normal IPA pipeline. Shared by the top-level markup expander
        // and recursively by the inside of a {marker ... marker} span.
        function convertPlainSpan(text, unmatched) {
            let out = '';
            let last = 0;
            for (const m of text.matchAll(PAUSE_RE)) {
                const before = text.slice(last, m.index);
                if (before.trim()) {
                    const { phonemeString, unmatched: u } = ipaToPhonemeString(before);
                    unmatched.push(...u);
                    out += ' ' + phonemeString;
                }
                out += ` [pause=${Math.round(parseFloat(m[1]) * 1000)}]`;
                last = m.index + m[0].length;
            }
            const rest = text.slice(last);
            if (rest.trim()) {
                const { phonemeString, unmatched: u } = ipaToPhonemeString(rest);
                unmatched.push(...u);
                out += ' ' + phonemeString;
            }
            return out.trim();
        }

        // Top-level entry point: expands all [{marker ... marker}] spans and
        // standalone pause markers in raw IPA text into a phoneme string
        // with the matching directives spliced in. NOTE: this operates on
        // plain IPA text and is wired into the non-ToBI path only -- ToBI
        // mode's chunk-based pipeline (for finding stressed syllables) and
        // this string-based one aren't combined in this pass.
        function expandProsodyMarkup(rawText, unmatched) {
            let out = '';
            let last = 0;
            for (const m of rawText.matchAll(PROSODY_MARKER_RE)) {
                out += ' ' + convertPlainSpan(rawText.slice(last, m.index), unmatched);
                const [, marker, inner] = m;
                const config = PROSODY_MARKERS[marker];
                const innerConverted = convertPlainSpan(inner, unmatched);
                if (config.gain !== undefined) {
                    out += ` [gain*${config.gain}] ${innerConverted} [gain*${(1 / config.gain).toFixed(6)}]`;
                } else if (config.localSpeed !== undefined) {
                    out += ` [localSpeed=${config.localSpeed}] ${innerConverted} [localSpeed=1]`;
                }
                last = m.index + m[0].length;
            }
            out += ' ' + convertPlainSpan(rawText.slice(last), unmatched);
            return out.trim();
        }


        //   L+H*, H+!H*                  -- bitonal, target/peak is the
        //                                    STARRED (second) tone
        //   L*+H                         -- bitonal, star is FIRST; pitch
        //                                    keeps rising after the accent
        // Phrase accents (H-, L-, !H-) and boundary tones (H%, L%, or the
        // combined L-L%/L-H%/H-H%/H-L%) describe the shape of the very END
        // of the intonational phrase, not the whole thing.
        const TOBI_OFFSET = { H: TONE_STEP, L: -TONE_STEP * 2, '!H': TONE_STEP * 0.5 };
        const TOBI_BOUNDARY_CONTOUR = {
            'L-L%': 'fall', 'H-H%': 'rise', 'L-H%': 'rise', 'H-L%': 'fall',
            'L%': 'fall', 'H%': 'rise', 'L-': 'fall', 'H-': 'flat', '!H-': 'flat',
        };

        function parseTobiToken(tok) {
            let m;
            if ((m = tok.match(/^(!?H|L)\+(!?H|L)\*$/))) return { kind: 'accent', shape: 'bitonal', first: m[1], second: m[2] };
            if ((m = tok.match(/^(!?H|L)\*\+(!?H|L)$/))) return { kind: 'accent', shape: 'trailing', first: m[1], second: m[2] };
            if ((m = tok.match(/^(!?H|L)\*$/))) return { kind: 'accent', shape: 'mono', tone: m[1] };
            if ((m = tok.match(/^%(!?H|L)$/))) return { kind: 'initialBoundary', tone: m[1] };
            if (tok in TOBI_BOUNDARY_CONTOUR) return { kind: 'boundary', text: tok, contour: TOBI_BOUNDARY_CONTOUR[tok] };
            return { kind: 'unknown', text: tok };
        }

        function tobiWrap(chunk, off) {
            chunk.output = `b${off >= 0 ? '+' : ''}${off} ${chunk.output} b${off >= 0 ? '-' : '+'}${Math.abs(off)}`;
        }
        function tobiLeanForward(chunk, off) {
            // One-sided: no undo after, so the register shift carries into
            // whatever follows -- used where the tone doesn't resolve back
            // by the end of the accented syllable (L*+H, downstep).
            chunk.output = `b${off >= 0 ? '+' : ''}${off} ${chunk.output}`;
        }

        // Applies one phrase's ToBI tone string to that phrase's chunks
        // (from ipaPhraseToChunks). Starred accents are consumed by the
        // FIRST unmapped stressed chunk, left to right, one accent per
        // syllable; a phrase accent/boundary tone (if present) shapes only
        // the last chunk via the existing [contour=] mid-string mechanism,
        // so it doesn't rescale the whole phrase.
        function applyTobiToPhrase(chunks, toneStr, warnings) {
            const tokens = toneStr.trim().split(/\s+/).filter(Boolean).map(parseTobiToken);
            const stressedIdxs = chunks.map((c, i) => (c.stressed ? i : -1)).filter(i => i >= 0);
            let nextStressed = 0;
            let boundaryContour = null;

            for (const t of tokens) {
                if (t.kind === 'accent') {
                    if (nextStressed >= stressedIdxs.length) {
                        warnings.push(`ToBI: no more stressed syllables available for a pitch accent`);
                        continue;
                    }
                    const chunk = chunks[stressedIdxs[nextStressed++]];
                    if (t.shape === 'mono') {
                        tobiWrap(chunk, TOBI_OFFSET[t.tone] ?? 0);
                    } else if (t.shape === 'bitonal') {
                        tobiWrap(chunk, TOBI_OFFSET[t.second] ?? 0); // star = target
                    } else if (t.shape === 'trailing') {
                        tobiLeanForward(chunk, TOBI_OFFSET[t.first] ?? 0); // star, carries into H after
                    }
                } else if (t.kind === 'boundary') {
                    boundaryContour = t.contour;
                } else if (t.kind === 'initialBoundary') {
                    if (chunks.length) tobiLeanForward(chunks[0], TOBI_OFFSET[t.tone] ?? 0);
                } else {
                    warnings.push(`ToBI: unrecognized tone "${t.text}"`);
                }
            }

            if (boundaryContour && boundaryContour !== 'flat' && chunks.length > 1) {
                const head = chunks.slice(0, -1).map(c => c.output).join(' ');
                const last = chunks[chunks.length - 1].output;
                return `${head} [contour=${boundaryContour}] ${last}`.trim();
            }
            return chunks.map(c => c.output).join(' ');
        }

        const input = document.getElementById('ipa');
        const button = document.getElementById('playBtn');
        const status = document.getElementById('status');
        const speedSlider = document.getElementById('speed');
        const speedValue = document.getElementById('speedValue');
        const glideSpeedSlider = document.getElementById('glideSpeed');
        const glideSpeedValue = document.getElementById('glideSpeedValue');
        const tobiCheckbox = document.getElementById('tobiEnabled');
        const tobiRow = document.getElementById('tobiRow');
        const tobiInput = document.getElementById('tobi');
        const phonemicCheckbox = document.getElementById('phonemicEnabled');
        const phonemicRows = document.getElementById('phonemicRows');
        const phonemicInput = document.getElementById('phonemic');
        const soundChangesInput = document.getElementById('soundChanges');

        tobiCheckbox.addEventListener('change', () => {
            tobiRow.style.display = tobiCheckbox.checked ? '' : 'none';
        });

        phonemicCheckbox.addEventListener('change', () => {
            const on = phonemicCheckbox.checked;
            phonemicRows.style.display = on ? '' : 'none';
            input.disabled = on;
        });

        speedSlider.addEventListener('input', () => {
            speedValue.textContent = `${Number(speedSlider.value).toFixed(2)}×`;
        });
        glideSpeedSlider.addEventListener('input', () => {
            glideSpeedValue.textContent = `${Number(glideSpeedSlider.value).toFixed(2)}×`;
        });

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.classList.toggle('error', isError);
        }

        async function playIpa() {
            let raw = input.value;
            let phonemicNote = '';

            if (phonemicCheckbox.checked) {
                const phonemicText = phonemicInput.value;
                if (!phonemicText || !phonemicText.trim()) {
                    setStatus('Type the phonemic form first.', true);
                    return;
                }
                const { result, warnings } = applySoundChanges(phonemicText, soundChangesInput.value);
                if (warnings.length) console.warn(warnings.join('; '));
                if (!result.trim()) {
                    setStatus('Sound changes produced an empty result.', true);
                    return;
                }
                raw = result;
                phonemicNote = `/${phonemicText.trim()}/ → `;
            }

            if (!raw || !raw.trim()) {
                setStatus('Type some IPA text first.', true);
                return;
            }

            let phonemeString, unmatched;
            if (tobiCheckbox.checked) {
                // IPA phrases are separated by "%" (ToBI's own boundary-tone
                // symbol, reused here as the phrase divider); the tone tier
                // is separated by "|", one section per IPA phrase. Phrases
                // are rejoined with "." so each one is also its own
                // sentence for the sequencer's contour engine.
                const ipaPhrases = raw.split('%').map(s => s.trim()).filter(Boolean);
                const tobiPhrases = tobiInput.value.split('|').map(s => s.trim());
                if (tobiInput.value.trim() && tobiPhrases.length !== ipaPhrases.length) {
                    console.warn(`ToBI has ${tobiPhrases.length} section(s) separated by "|" but the IPA has ${ipaPhrases.length} section(s) separated by "%" -- extra sections on either side are ignored.`);
                }
                const allUnmatched = [];
                const tobiWarnings = [];
                const phraseStrings = ipaPhrases.map((phraseText, i) => {
                    const { chunks, unmatched: phraseUnmatched } = ipaPhraseToChunks(phraseText);
                    allUnmatched.push(...phraseUnmatched);
                    const toneStr = tobiPhrases[i];
                    return toneStr ? applyTobiToPhrase(chunks, toneStr, tobiWarnings) : chunks.map(c => c.output).join(' ');
                });
                if (tobiWarnings.length) console.warn(tobiWarnings.join('; '));
                phonemeString = phraseStrings.filter(Boolean).join(' . ');
                unmatched = allUnmatched;
            } else {
                const markupUnmatched = [];
                phonemeString = expandProsodyMarkup(raw, markupUnmatched);
                unmatched = markupUnmatched;
            }

            if (!phonemeString) {
                setStatus('No recognizable IPA symbols found.', true);
                return;
            }

            const allophonicLabel = `${phonemicNote}[${raw.trim()}]`;
            if (unmatched.length) {
                setStatus(`Playing ${allophonicLabel} (skipped unknown: ${unmatched.join(' ')})`);
            } else {
                setStatus(`Playing ${allophonicLabel}`);
            }

            button.disabled = true;
            button.classList.add('playing');

            try {
                if (typeof speak !== 'function') {
                    throw new Error('speak() is not defined yet — wire it up in src/main.js.');
                }
                // NOTE: main.js's speak() needs to forward these options into
                // compileString(phonemeString, opts) (sequencer.js) -- that's
                // where they actually scale the schedule. `speed` only moves
                // WHEN phonemes happen (pacing/holds/pauses); `glideSpeed` only
                // affects how fast transitions/diphthong glides move, kept
                // independent so speeding up talking pace doesn't also speed
                // up how fast the mouth physically glides between sounds.
                await speak(phonemeString, {
                    speed: Number(speedSlider.value),
                    glideSpeed: Number(glideSpeedSlider.value),
                });
            } catch (err) {
                setStatus(err.message || 'Playback failed.', true);
            } finally {
                button.disabled = false;
                button.classList.remove('playing');
            }
        }

        button.addEventListener('click', playIpa);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') playIpa();
        });
    </script>
</body>
</html>
