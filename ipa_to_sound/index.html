<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
        name="IPA Reader"
        content="It transforms the IPA text into a phoneme string computable by klattsch, then it uses the klattsch engine with expanded phoneme inventory"
      />
    <title>Lexicon</title>
    <link rel="icon" type="image/png" href="/icons/favicon.png" />

    <style>
        :root {
            --main-green: #2e7d32;
            --light-green: #a5d6a7;
            --bg: #f4fdf6;
            --text: #1b1b1b;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: var(--main-green);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }

        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 1rem;
        }

        #ipa {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid var(--light-green);
            border-radius: 10px;
            font-size: 1rem;
        }



        /* ─── play button ────────────────────────────────────────────────── */
        .play-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.7rem;
            padding: 0.35rem 0.85rem 0.35rem 0.6rem;
            border: 2px solid var(--main-green);
            border-radius: 999px;
            background: transparent;
            color: var(--main-green);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }

        .play-btn:hover {
            background: var(--main-green);
            color: white;
        }

        .play-btn:active {
            transform: scale(0.94);
        }

        .play-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .play-btn.playing {
            background: var(--main-green);
            color: white;
            animation: pulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.4);
            }
            100% {
                box-shadow: 0 0 0 6px rgba(46, 125, 50, 0);
            }
        }

        .status {
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: #4a4a4a;
            min-height: 1.2em;
        }

        .status.error {
            color: #c62828;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.9rem;
            font-size: 0.85rem;
            color: var(--text);
        }

        .speed-control input[type="range"] {
            accent-color: var(--main-green);
            width: 220px;
        }

        .speed-control output {
            font-variant-numeric: tabular-nums;
            min-width: 3.2em;
            font-weight: 600;
            color: var(--main-green);
        }

        .ipa-advanced-input {
            width: 100%;
            min-height: 2.6rem;
            padding: 0.9rem;
            border: 2px solid var(--light-green);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            white-space: pre-wrap;
            outline: none;
            background: white;
        }

        .tag-marker {
            display: inline-block;
            width: 0;
            border-left: 3px solid currentColor;
            height: 1.15em;
            vertical-align: middle;
            margin: 0 2px;
            cursor: pointer;
        }
        .tag-marker:hover { filter: brightness(0.7); }

        .tag-menus-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.7rem;
        }
        .tag-menu-box {
            width: 200px;
            padding: 0.6rem;
            border: 2px solid #888;
            border-radius: 8px;
            background: white;
            font-size: 0.85rem;
        }
        .tag-menu-box label {
            display: block;
            font-size: 0.75rem;
            margin-top: 0.4rem;
            color: #444;
        }
        .tag-menu-box select,
        .tag-menu-box input[type="text"],
        .tag-menu-box input[type="number"] {
            width: 100%;
            padding: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 0.15rem;
            font-size: 0.85rem;
        }
        .tag-menu-box input[type="color"] {
            margin-top: 0.15rem;
            width: 100%;
            height: 1.6rem;
        }
        .tag-menu-box button {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
        }
        .tag-hint {
            font-size: 0.7rem;
            color: #666;
            margin-top: 0.3rem;
        }
        .minimize-bar {
            margin-top: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ─── IPA keyboard ───────────────────────────────────────────────── */
        .ipa-kb {
            margin-top: 0.7rem;
            border: 2px solid var(--light-green);
            border-radius: 10px;
            background: white;
            padding: 0.8rem;
        }
        .ipa-kb-tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }
        .ipa-kb-tab {
            padding: 0.3rem 0.8rem;
            border: 2px solid var(--main-green);
            border-radius: 999px;
            background: transparent;
            color: var(--main-green);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .ipa-kb-tab.active,
        .ipa-kb-tab:hover {
            background: var(--main-green);
            color: white;
        }
        .ipa-kb-scroll {
            overflow-x: auto;
        }
        .ipa-kb-table {
            border-collapse: collapse;
            font-size: 0.85rem;
            width: 100%;
        }
        .ipa-kb-table th,
        .ipa-kb-table td {
            border: 1px solid #dfe9df;
            padding: 2px;
            text-align: center;
            white-space: nowrap;
        }
        .ipa-kb-table thead th {
            background: var(--bg);
            color: var(--main-green);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 6px;
        }
        .ipa-kb-table tbody th {
            text-align: left;
            font-size: 0.72rem;
            color: #444;
            font-weight: 600;
            padding: 2px 8px;
            white-space: nowrap;
            background: var(--bg);
        }
        .ipa-kb-table td.empty {
            background: repeating-linear-gradient(45deg, #f2f2f2, #f2f2f2 4px, #e8e8e8 4px, #e8e8e8 8px);
        }
        .ipa-key {
            font-size: 1.05rem;
            min-width: 1.9em;
            padding: 0.15rem 0.3rem;
            margin: 1px;
            border: 1px solid var(--light-green);
            border-radius: 6px;
            background: white;
            color: var(--text);
            cursor: pointer;
            font-family: "Doulos SIL", "Charis SIL", "Gentium", "Segoe UI", Arial, sans-serif;
        }
        .ipa-key:hover {
            background: var(--light-green);
        }
        .ipa-key:active {
            transform: scale(0.92);
        }
        .ipa-key.unsupported {
            opacity: 0.35;
        }
        .ipa-kb-marks {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
        }
        .ipa-kb-mark-group {
            min-width: 140px;
        }
        .ipa-kb-mark-group-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 0.2rem;
        }
        .ipa-kb-mark-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }
        .ipa-kb-hint {
            font-size: 0.7rem;
            color: #666;
            margin-top: 0.5rem;
        }

    </style>
</head>
<body>
    <header>
        <h1>IPA player</h1>
    </header>
    <main>
        <div class="controls">
            <input id="ipa" value="he.'lo͡ʊ 'ðɛ.ɚ || ðɪs ɪs 'kʊɫ" placeholder="IPA text" />
        </div>
        <div class="speed-control">
            <label for="kbEnabled"><input id="kbEnabled" type="checkbox" /> IPA keyboard</label>
        </div>
        <div id="kbPanel" class="ipa-kb" style="display:none;"></div>
        <button id="playBtn" class="play-btn">Play</button>
        <button id="downloadBtn" class="play-btn">⬇ Download WAV</button>
        <div class="speed-control">
            <label for="speed">Pace</label>
            <input id="speed" type="range" min="0.5" max="2.5" step="0.05" value="1" />
            <output id="speedValue" for="speed">1.00×</output>
        </div>
        <div class="speed-control">
            <label for="glideSpeed">Glide speed</label>
            <input id="glideSpeed" type="range" min="0.5" max="2.5" step="0.05" value="1" />
            <output id="glideSpeedValue" for="glideSpeed">1.00×</output>
        </div>
        <div class="speed-control">
            <label for="tobiEnabled"><input id="tobiEnabled" type="checkbox" /> ToBI prosody</label>
        </div>
        <div class="speed-control" id="tobiRow" style="display:none;">
            <label for="tobi">Tones</label>
            <input id="tobi" type="text" placeholder="H* L-L% | H* L-H%"
                   style="flex:1; padding:0.4rem; border:2px solid var(--light-green); border-radius:8px;" />
        </div>
        <div class="speed-control">
            <label for="phonemicEnabled"><input id="phonemicEnabled" type="checkbox" /> Phonemic mode</label>
        </div>
        <div id="phonemicRows" style="display:none;">
            <div class="controls">
                <label for="phonemic" style="font-size:0.85rem; display:block; margin-bottom:0.2rem;">/ phonemes /</label>
                <input id="phonemic" placeholder="p a t a" />
            </div>
            <div class="controls">
                <label for="soundChanges" style="font-size:0.85rem; display:block; margin-bottom:0.2rem;">sound changes (one rule per line)</label>
                <textarea id="soundChanges" rows="4" placeholder="T > D / V_V&#10;h > Ø / V_V"
                          style="width:100%; padding:0.9rem; border:2px solid var(--light-green); border-radius:10px; font-size:1rem; box-sizing:border-box;"></textarea>
            </div>
        </div>
        <div class="speed-control">
            <label for="advancedEnabled"><input id="advancedEnabled" type="checkbox" /> Advanced prosody</label>
        </div>
        <div id="advancedRows" style="display:none;">
            <div class="controls">
                <label style="font-size:0.85rem; display:block; margin-bottom:0.2rem;">
                    IPA text (tags shown as colored vertical lines, not characters)
                </label>
                <div id="ipaAdvanced" class="ipa-advanced-input" contenteditable="true"></div>
            </div>
            <button id="insertTagBtn" class="play-btn" type="button">+ Insert tag</button>
            <div id="tagMenuContainer"></div>
        </div>
        <p id="status" class="status"></p>
    </main>
    <script type="module" src="src/main.js?v=0.5.0"></script>
    <script type="module">
        // NOTE: this assumes a global `speak(phonemeString)` function is already
        // provided elsewhere in the app (e.g. loaded by src/main.js), which takes
        // phoneme codes from bundled.js separated by spaces (e.g. "HH EH L O")
        // and synthesizes/plays the audio. If that's not the case yet, replace
        // the call inside playIpa() below with whatever your synth entry point is.
        import { bundled } from './src/engine/banks/bundled.js';

        const DATASET_NAME = 'ipa-soldgabriel-2026';
        const phonemeDefs = bundled[DATASET_NAME].phonemes;

        // Build a map of IPA symbol -> phoneme code (e.g. "ʂ" -> "SS").
        // Most entries only carry the symbol inside "example": "[ʂ]"; a few
        // also have an explicit "ipa" field, which takes precedence.
        // Symbols are stored NFD-normalized so precomposed accented letters
        // (e.g. "ă") and combining-mark sequences (e.g. "a" + breve) line up.
        function buildIpaMap() {
            const map = new Map();
            for (const [code, def] of Object.entries(phonemeDefs)) {
                let symbol = def.ipa;
                if (!symbol && def.example) {
                    const match = def.example.match(/\[(.+)\]/);
                    if (match) symbol = match[1];
                }
                if (symbol) {
                    const key = symbol.normalize('NFD');
                    if (map.has(key)) {
                        // Data bug in bundled.js: two phonemes share the same
                        // example symbol, so the second one silently makes the
                        // first unreachable from typed IPA. Surface it loudly
                        // instead of swallowing it -- e.g. LFN and LNFN both
                        // currently claim "[ã]".
                        console.warn(
                            `IPA symbol "${symbol}" is claimed by both ${map.get(key)} and ${code} in bundled.js; ` +
                            `${code} wins and ${map.get(key)} is now unreachable from typed IPA.`
                        );
                    }
                    map.set(key, code);
                }
            }
            return map;
        }

        const ipaMap = buildIpaMap();

        // Explicit override: the plain letter "r" (IPA alveolar trill) is not
        // looked up in bundled.js at all — it's always realized as a
        // multi-tap flap sequence.
        ipaMap.set('r', '( DX DX DX DX )');
        ipaMap.set('ʰ', 'r-60 ( H ) r+60');
        ipaMap.set('ʲ', 'r-60 ( J ) r+60');
        ipaMap.set('ʷ', 'r-60 ( W ) r+60');
        ipaMap.set('ˠ', 'r-60 ( VELR ) r+60');

        // Longest symbols first, so multi-character symbols (affricates like
        // "t͡ʃ", nasalized vowels like "ɑ̃") are matched before their parts.
        const symbolsByLength = [...ipaMap.keys()].sort((a, b) => b.length - a.length);

        // Diacritics that wrap the most recently emitted phoneme code as
        // "{prefix} {code} {closer}".
        const WRAP_DIACRITICS = {
            '\u02D0': { prefix: 'r220', closer: 'r' }, // ː  long
            ':': { prefix: 'r220', closer: 'r' },      // :  ASCII stand-in for ː
            '\u02D1': { prefix: 'r165', closer: 'r' }, // ˑ  half-long
            '\u0306': { prefix: 'r70', closer: 'r' },  // ̆  extra-short (combining breve)
            '\u0324': { prefix: 'h0.9', closer: 'h' }, // ̤  breathy voice (combining diaeresis below)
        };

        // Boundary marks: emitted as standalone tokens, not tied to a phoneme.
        // '\u2197' (rising arrow) and '\u2193' (downstep arrow) piggyback on
        // this same mechanism: they don't wrap a phoneme, they just drop a
        // prosody directive into the stream at that point, which OVERRIDES
        // whatever contour/register was already in effect from there on.
        const BOUNDARY_TOKENS = {
            '|': ',', // minor (foot) boundary
            '\u2016': '.', // ‖ major (intonation) boundary
            '\u2197': '[contour=rise]', // ↗ forces a rising contour for the rest of the clause
            '\u2193': 'b-20', // ↓ downstep: permanent register step-down from here on
        };
        // Which BOUNDARY_TOKENS are prosody marks (vs basic structural
        // boundaries like | and ‖, which keep working even when advanced
        // prosody mode suppresses the others).
        const PROSODY_ONLY_BOUNDARY_CHARS = new Set(['\u2197', '\u2193']);
        // Set true while Advanced Prosody mode compiles its input: the
        // extIPA prosody marks (tone diacritics, Chao tone letters, ↗/↓)
        // are ignored in favor of the tag system instead of double-applying
        // both systems at once.
        let SUPPRESS_TONE_PROSODY = false;

        // Combining tone diacritics that wrap the LAST emitted code, same
        // mechanism as WRAP_DIACRITICS above (length marks etc.) — level
        // tones use a symmetric pitch bump that's undone right after, so
        // they never leave a lasting shift on what follows; á/à/ā are
        // level tones (high/low/mid), â/ǎ are contour tones (a real glide
        // within that one syllable, not just a level shift).
        const TONE_STEP = 12; // Hz per Chao tone-level step, used everywhere below
        const TONE_WRAP_DIACRITICS = {
            '\u0301': { prefix: `b+${TONE_STEP * 2}`, closer: `b-${TONE_STEP * 2}` }, // á high tone
            '\u0300': { prefix: `b-${TONE_STEP * 2}`, closer: `b+${TONE_STEP * 2}` }, // à low tone
            '\u0304': null, // ā mid/level tone -- reference level, no shift needed
        };
        // Contour (glide) tone diacritics: only cleanly representable as a
        // real within-syllable pitch glide when the code they're attached
        // to hasn't already been wrapped by something else (see comment at
        // its use below); falls back to a level-shift approximation
        // otherwise, which still sounds directionally right even if it's
        // not a true glide.
        const CONTOUR_TONE_DIACRITICS = {
            '\u0302': -TONE_STEP * 3, // â circumflex: falling contour (high -> low)
            '\u030C': TONE_STEP * 3,  // ǎ caron: rising contour (low -> high)
        };

        // Chao tone-letter levels (˥˦˧˨˩ = 5..1, high to low). These are
        // PREFIX marks in this app's convention (e.g. "˦a"), unlike the
        // combining marks above which are suffixes (e.g. "á"). A run of
        // several in a row (e.g. "˧˦˧a") describes a multi-point contour
        // across the syllable, not just its start and end.
        const TONE_LEVELS = {
            '\u02E5': 5, '\u02E6': 4, '\u02E7': 3, '\u02E8': 2, '\u02E9': 1,
        };

        // Stress marks: wrap an entire "." separated segment as
        // "{prefix} b+1 {segment} r b".
        const STRESS_WRAPS = {
            '\u02C8': { prefix: 'r150' }, // ˈ primary stress
            "'": { prefix: 'r150' },      // ' ASCII stand-in for ˈ
            '\u02CC': { prefix: 'r125' }, // ˌ secondary stress
        };

        // Tie bar: links two adjacent symbols into one glide, e.g. affricate
        // "t͡ʃ" or diphthong "a͡ʊ" (symbol + U+0361 + symbol). U+035C (tie
        // bar placed below instead of above) is the same thing typographically
        // and is treated identically. Maps straight onto the sequencer's
        // "[glideTo]" directive: the first symbol glides toward the second.
        const TIE_BAR_CHARS = new Set(['\u0361', '\u035C']);

        function matchSymbolAt(text, pos) {
            for (const symbol of symbolsByLength) {
                if (text.startsWith(symbol, pos)) return symbol;
            }
            return null;
        }

        function wrapLastCode(codes, prefix, closer) {
            if (codes.length === 0) return false;
            codes[codes.length - 1] = `${prefix} ${codes[codes.length - 1]} ${closer}`;
            return true;
        }

        // Builds one combined token for a run of Chao tone levels (e.g.
        // [3,4,3] for "˧˦˧") applied to a base phoneme code. Each level
        // becomes one repetition of the base code, grouped into a syllable
        // "( ... )" so they share a single syllable's time slot instead of
        // sounding like separate extra sounds; a sticky delta between
        // consecutive repetitions carries the pitch from one level to the
        // next. A trailing directive (outside the group, so it's silent)
        // undoes the total drift so the contour never leaks into whatever
        // comes after it.
        function buildToneContour(levels, baseCode) {
            const offsets = levels.map(L => (L - 3) * TONE_STEP);
            const parts = offsets.map((off, i) => {
                const step = i === 0 ? off : off - offsets[i - 1];
                if (step === 0) return baseCode;
                return `${baseCode}${step > 0 ? '+' : ''}${step}`;
            });
            const net = offsets[offsets.length - 1];
            const correction = net === 0 ? '' : ` b${net > 0 ? '-' : '+'}${Math.abs(net)}`;
            return `( ${parts.join(' ')} )${correction}`;
        }

        // Tokenizes a single (already dot-split) chunk of IPA text into an
        // array of phoneme-code tokens. Does not know about "." or stress
        // marks — those are handled per-segment by ipaToPhonemeString.
        function tokenizeSegment(text) {
            const codes = [];
            const unmatched = [];
            let i = 0;

            outer:
            while (i < text.length) {
                const ch = text[i];

                if (/\s/.test(ch)) {
                    i++;
                    continue;
                }

                if (ch in WRAP_DIACRITICS) {
                    const { prefix, closer } = WRAP_DIACRITICS[ch];
                    if (!wrapLastCode(codes, prefix, closer)) unmatched.push(ch);
                    i++;
                    continue;
                }

                // Suffix level tones: á/à/ā. Symmetric bump-and-undo, so a
                // level tone shifts just that one syllable's register and
                // never leaks into what follows.
                if (ch in TONE_WRAP_DIACRITICS) {
                    if (SUPPRESS_TONE_PROSODY) { i++; continue; } // ignored, per advanced prosody mode
                    const wrap = TONE_WRAP_DIACRITICS[ch];
                    if (wrap) {
                        if (!wrapLastCode(codes, wrap.prefix, wrap.closer)) unmatched.push(ch);
                    } else if (codes.length === 0) {
                        unmatched.push(ch); // ā (mid) with nothing to attach to
                    }
                    i++;
                    continue;
                }

                // Suffix contour tones: â (falling) / ǎ (rising). When the
                // last code is still bare (no earlier diacritic has wrapped
                // it) this rewrites it as a real transient pitch glide
                // within that one phoneme, e.g. "AA" -> "AA(-36)" — the
                // most accurate representation. If something already
                // wrapped it (e.g. a preceding length mark), a true glide
                // can no longer be spliced into the middle of that string
                // safely, so this falls back to a symmetric register-shift
                // wrap instead — directionally right, just not a true glide.
                if (ch in CONTOUR_TONE_DIACRITICS) {
                    if (SUPPRESS_TONE_PROSODY) { i++; continue; } // ignored, per advanced prosody mode
                    const delta = CONTOUR_TONE_DIACRITICS[ch];
                    if (codes.length === 0) {
                        unmatched.push(ch);
                    } else if (/^[A-Z]+$/.test(codes[codes.length - 1])) {
                        codes[codes.length - 1] += `(${delta > 0 ? '+' : ''}${delta})`;
                    } else {
                        wrapLastCode(codes, `b${delta > 0 ? '+' : ''}${delta}`, `b${delta > 0 ? '-' : '+'}${Math.abs(delta)}`);
                    }
                    i++;
                    continue;
                }

                if (ch in BOUNDARY_TOKENS) {
                    if (SUPPRESS_TONE_PROSODY && PROSODY_ONLY_BOUNDARY_CHARS.has(ch)) { i++; continue; }
                    codes.push(BOUNDARY_TOKENS[ch]);
                    i++;
                    continue;
                }

                // Tie bar: "t͡ʃ" / "a͡ʊ" etc. -- glide the preceding symbol
                // toward whatever symbol follows the tie mark.
                if (TIE_BAR_CHARS.has(ch)) {
                    const nextSymbol = matchSymbolAt(text, i + 1);
                    if (codes.length === 0 || !nextSymbol) {
                        unmatched.push(ch);
                        i++;
                        continue;
                    }
                    const nextCode = ipaMap.get(nextSymbol);
                    const lastCode = codes[codes.length - 1];
                    // Only safe to tie when the preceding code is still a
                    // single bare phoneme token (possibly with its own
                    // inline pitch suffix from a tone mark, e.g. "AA(-36)")
                    // -- [glideTo] must directly follow one phoneme and be
                    // directly followed by one phoneme (see sequencer.js).
                    // If something earlier (a length mark, etc.) already
                    // wrapped it into a multi-token string, tying it here
                    // would break that adjacency, so both symbols are kept
                    // as separate, non-glide-linked sounds instead --
                    // audible either way, just not glide-joined.
                    if (/^[A-Z]+(\([+-]?\d+(?:\.\d+)?\)|[+-]?\d+(?:\.\d+)?)?$/.test(lastCode)) {
                        codes[codes.length - 1] = `${lastCode} [glideTo] ${nextCode}`;
                    } else {
                        codes.push(nextCode);
                    }
                    i += 1 + nextSymbol.length;
                    continue;
                }

                // Prefix Chao tone letters: ˦a (one level) or ˧˦˧a (a
                // multi-point contour) — consume the whole run of tone-level

// --- Segmentation ------------------------------------------------------
const CLASS_LETTERS = new Set('ABCDEFHJKLMNOPQRSTUVWZ'.split(''));

// Stress prefix marks: ˈ (IPA), ' (ascii stand-in), ” (as given by the user).
// Combining acute (0301) is handled separately as a SUFFIX mark (V́ / ´V).
const STRESS_PREFIX = new Set(['\u02C8', "'", '\u201D', '\u00B4']);
const NASAL_PREFIX = '~';

function isCombining(ch) {
  return ch && /\p{Mn}/u.test(ch) && ch !== TIE;

function segmentPhonemic(text) {
  const t = text.normalize('NFD');
  const segments = [];
  let i = 0;
  let pendingStress = false;
  while (i < t.length) {
    const ch = t[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (BOUNDARY_CHARS.has(ch)) { segments.push({ text: ch, boundary: ch, stressed: false }); i++; continue; }
    if (STRESS_PREFIX.has(ch)) { pendingStress = true; i++; continue; }
    if (ch === '\u0301' && segments.length === 0) { pendingStress = true; i++; continue; } // stray leading acute
    if (i >= t.length) break;
    let seg = t[i]; i++;
    while (i < t.length) {
      if (t[i] === TIE) {
        seg += t[i]; i++;
        if (i < t.length) { seg += t[i]; i++; }
      } else if (t[i] === '\u0301') { pendingStress = true; i++; } // suffix acute = stress (V́)
      else if (isCombining(t[i])) { seg += t[i]; i++; }
      else break;
    }
    segments.push({ text: seg.normalize('NFC'), boundary: null, stressed: pendingStress });
    pendingStress = false;
  }

}

function baseOf(segText) {
  return segText.normalize('NFD').replace(/[\u0300-\u036F]/g, m => (m === TIE ? m : '')).normalize('NFC');

  return !seg.boundary && seg.text.normalize('NFD').includes('\u0303');
}

  if (seg.boundary) return false;

// --- Shared atom parsing -----------------------------------------------
// One "atom" = an optional stress mark (prefix ´/'/”, or suffix combining
// acute), an optional nasal mark (prefix ~, suffix combining tilde, or a
// bracket [+nas]/[-nas] suffix), and a base: a class letter, Ø, X0, or a
// literal IPA run (which may itself be a {a,b,c} alternation set).
// Returns { kind: 'null'|'copy'|'class'|'literal'|'alt', ... }.
function parseAtom(raw) {
  let s = raw.trim();
  if (s === 'Ø') return { kind: 'null' };
  if (s === 'X0') return { kind: 'copy' };

  let stressed, nasal;
  while (s.length && (STRESS_PREFIX.has(s[0]))) { stressed = true; s = s.slice(1); }
  while (s.length && s[0] === NASAL_PREFIX) { nasal = true; s = s.slice(1); }

  const bracketM = s.match(/^(.*)\[([+-])nas\]$/);
  if (bracketM) { s = bracketM[1]; nasal = bracketM[2] === '+'; }

  // {a,b,c} alternation set -- each option parsed recursively
  if (s.startsWith('{') && s.endsWith('}')) {
    const options = s.slice(1, -1).split(',').map(o => parseAtom(o.trim()));
    return { kind: 'alt', options, stressed, nasal };
  }

  let nfd = s.normalize('NFD');
  while (nfd.length > 1) {
    const last = nfd[nfd.length - 1];
    if (last === '\u0301') { stressed = true; nfd = nfd.slice(0, -1); }
    else if (last === '\u0303') { nasal = true; nfd = nfd.slice(0, -1); }
    else break;
  }
  s = nfd.normalize('NFC');

  if (s.length === 1 && CLASS_LETTERS.has(s)) return { kind: 'class', letter: s, stressed, nasal };
  const segs = segmentPhonemic(s);
  return { kind: 'literal', text: segs.map(x => x.text).join(''), stressed, nasal };
}

function atomToMatcher(atom) {
  if (atom.kind === 'null') return { type: 'null' };
  if (atom.kind === 'copy') return { type: 'literal', text: 'X0' }; // X0 as a bare target isn't meaningful; treat literally
  if (atom.kind === 'alt') return { type: 'altGroup', options: atom.options.map(atomToMatcher) };
  if (atom.kind === 'class') return { type: 'class', letter: atom.letter, stressed: atom.stressed, nasal: atom.nasal };
  return { type: 'literal', text: atom.text, stressed: atom.stressed, nasal: atom.nasal };
}

function atomToOutput(atom) {
  if (atom.kind === 'null') return { type: 'null' };
  if (atom.kind === 'copy') return { type: 'copy' };
  if (atom.kind === 'alt') return atomToOutput(atom.options[0]); // deterministic: first alternative
  if (atom.nasal !== undefined) return { type: 'featureToggle', nasal: atom.nasal };
  if (atom.kind === 'class') return { type: 'class', letter: atom.letter };
  return { type: 'literal', text: atom.text };
}



// Parses one side of a rule's environment (left or right of "_") into a
// list of matcher objects: class letters (optionally stress/nasal-marked),
// literal IPA text, {a,b,c} alternation, # $ % boundaries, and a single
// level of "(X)" for zero-or-more X.
function parseEnvSide(spec) {
  const s = spec.normalize('NFD');
  const matchers = [];
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === '(') {
      const close = findMatchingParen(s, i);
      if (close === -1) throw new Error(`unmatched "(" in environment "${spec}"`);
      const inner = parseEnvSide(s.slice(i + 1, close));
      matchers.push({ type: 'optional', inner });
      i = close + 1;
      continue;
    }
    if (BOUNDARY_CHARS.has(ch)) { matchers.push({ type: 'boundary', char: ch }); i++; continue; }
    if (ch === '\u00D8' || ch === 'Ø') { i++; continue; } // "nothing"
    if (ch === '{') {
      const close = s.indexOf('}', i);
      if (close === -1) throw new Error(`unmatched "{" in environment "${spec}"`);
      const atom = parseAtom(s.slice(i, close + 1).normalize('NFC'));
      matchers.push(atomToMatcher(atom));
      i = close + 1;
      continue;
    }
    // one atom: optional prefix marks + base (+ combining suffixes, tie)
    const { atomText, next } = consumeAtomSpan(s, i);
    const atom = parseAtom(atomText.normalize('NFC'));
    matchers.push(atomToMatcher(atom));
    i = next;
  }
  return matchers;
}

function findMatchingParen(s, openIdx) {
  let depth = 0;
  for (let i = openIdx; i < s.length; i++) {
    if (s[i] === '(') depth++;
    else if (s[i] === ')') { depth--; if (depth === 0) return i; }
  }
  return -1;
}

// Consumes one atom's raw text span starting at i: prefix stress/nasal
// marks, one base char, then any tie-linked char / combining diacritics.
function consumeAtomSpan(s, i) {
  const STRESS_PREFIX = new Set(['\u02C8', "'", '\u201D', '\u00B4']);
  const TIE = '\u0361';
  let start = i;
  while (i < s.length && STRESS_PREFIX.has(s[i])) i++;
  while (i < s.length && s[i] === '~') i++;

    if (target.nasal !== undefined && segIsNasal(seg) !== target.nasal) return false;

  if (target.type === 'class') {
    if (seg.boundary) return false;
    if (target.stressed && !seg.stressed) return false;

                { show: 'ǎ', insert: '\u030C', title: 'rising contour' },
            ] },
        ];

        // A symbol is "supported" if this app's engine actually knows what
        // to do with it -- either it's in the phoneme bank (ipaMap), or
        // it's one of the special prosody marks handled elsewhere in this
        // file. Unsupported buttons stay clickable (typing them is still
        // valid IPA) but are shown faded, matching how playIpa() already
        // reports unrecognized symbols as "skipped" rather than erroring.
        function isSupportedSymbol(symbol) {
            if (!symbol) return false;
            if (ipaMap.has(symbol.normalize('NFD'))) return true;
            if (Object.prototype.hasOwnProperty.call(WRAP_DIACRITICS, symbol)) return true;
            if (Object.prototype.hasOwnProperty.call(BOUNDARY_TOKENS, symbol)) return true;
            if (Object.prototype.hasOwnProperty.call(TONE_WRAP_DIACRITICS, symbol)) return true;
            if (Object.prototype.hasOwnProperty.call(CONTOUR_TONE_DIACRITICS, symbol)) return true;
            if (Object.prototype.hasOwnProperty.call(TONE_LEVELS, symbol)) return true;
            if (Object.prototype.hasOwnProperty.call(STRESS_WRAPS, symbol)) return true;
            if (TIE_BAR_CHARS.has(symbol)) return true;
            return false;
        }

        function insertIntoPlainInput(el, symbol) {
            if (el.disabled) {
                setStatus('Turn off phonemic mode to use the IPA keyboard here.', true);
                return;
            }
            const start = el.selectionStart != null ? el.selectionStart : el.value.length;
            const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
            el.value = el.value.slice(0, start) + symbol + el.value.slice(end);
            const pos = start + symbol.length;
            el.focus();
            el.setSelectionRange(pos, pos);
        }

        function insertIntoAdvancedField(symbol) {
            ipaAdvanced.focus();
            const sel = window.getSelection();
            let range;
            if (sel && sel.rangeCount > 0 && ipaAdvanced.contains(sel.anchorNode)) {
                range = sel.getRangeAt(0);
            } else {
                range = document.createRange();
                range.selectNodeContents(ipaAdvanced);
                range.collapse(false);
            }
            range.deleteContents();
            const textNode = document.createTextNode(symbol);
            range.insertNode(textNode);
            range.setStartAfter(textNode);
            range.setEndAfter(textNode);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // Routes a click to whichever field is actually accepting IPA text
        // right now: the Advanced Prosody editor when that mode is on,
        // otherwise the plain #ipa input.
        function insertIpaSymbol(symbol) {
            if (advancedCheckbox.checked) {
                insertIntoAdvancedField(symbol);
            } else {
                insertIntoPlainInput(input, symbol);
            }
        }

        function makeKeyButton(symbol, displayText, titleText) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'ipa-key';
            btn.textContent = displayText != null ? displayText : symbol;
            const supported = isSupportedSymbol(symbol);
            if (!supported) btn.classList.add('unsupported');
            btn.title = (titleText ? titleText + ' — ' : '') + symbol + (supported ? '' : ' (not recognized by this synthesizer)');
            btn.addEventListener('click', () => insertIpaSymbol(symbol));
            return btn;
        }

        function buildConsonantTable() {
            const wrap = document.createElement('div');
            wrap.className = 'ipa-kb-scroll';
            const table = document.createElement('table');
            table.className = 'ipa-kb-table';
            const thead = document.createElement('thead');
            const headRow = document.createElement('tr');
            headRow.appendChild(document.createElement('th'));
            for (const col of KB_CONSONANT_COLUMNS) {
                const th = document.createElement('th');
                th.textContent = col;
                headRow.appendChild(th);
            }
            thead.appendChild(headRow);
            table.appendChild(thead);
            const tbody = document.createElement('tbody');
            for (const row of KB_CONSONANTS) {
                const tr = document.createElement('tr');
                const rowHead = document.createElement('th');
                rowHead.scope = 'row';
                rowHead.textContent = row.label;
                tr.appendChild(rowHead);
                for (const [voiceless, voiced] of row.cells) {
                    const td = document.createElement('td');
                    if (voiceless) td.appendChild(makeKeyButton(voiceless, voiceless, `${row.label}, voiceless`));
                    if (voiced) td.appendChild(makeKeyButton(voiced, voiced, `${row.label}, voiced`));
                    if (!voiceless && !voiced) td.classList.add('empty');
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            wrap.appendChild(table);
            return wrap;
        }

        function buildVowelTable() {
            const wrap = document.createElement('div');
            wrap.className = 'ipa-kb-scroll';
            const table = document.createElement('table');
            table.className = 'ipa-kb-table';
            const thead = document.createElement('thead');
            const headRow = document.createElement('tr');
            headRow.appendChild(document.createElement('th'));

        function buildMarksPanel() {
            const container = document.createElement('div');
            container.className = 'ipa-kb-marks';
            for (const group of KB_MARK_GROUPS) {
                const box = document.createElement('div');
                box.className = 'ipa-kb-mark-group';
                const label = document.createElement('div');
                label.className = 'ipa-kb-mark-group-label';
                label.textContent = group.label;
                box.appendChild(label);
                const row = document.createElement('div');

        const KB_TABS = [
            { id: 'consonants', label: 'Consonants', build: buildConsonantTable },
            { id: 'vowels', label: 'Vowels', build: buildVowelTable },
            { id: 'marks', label: 'Marks', build: buildMarksPanel },
        ];

        function renderKeyboard() {
            kbPanel.innerHTML = '';
            const tabRow = document.createElement('div');
            tabRow.className = 'ipa-kb-tabs';
            const body = document.createElement('div');
            body.className = 'ipa-kb-body';

            function showTab(id) {
                body.innerHTML = '';
                body.appendChild(KB_TABS.find(t => t.id === id).build());
                for (const btn of tabRow.children) {
                    btn.classList.toggle('active', btn.dataset.tab === id);
                }
            }

        // Buttons are activated on click, but the mousedown that precedes it
        // would otherwise steal focus (and the current cursor position) away
        // from the #ipa input or the Advanced Prosody editor first -- so the
        // insert would land in the wrong place. Suppressing that default
        // keeps focus/selection right where the person left it.
        kbPanel.addEventListener('mousedown', (e) => {
            if (e.target.closest('.ipa-key, .ipa-kb-tab')) e.preventDefault();
        });

        kbCheckbox.addEventListener('change', () => {
            const on = kbCheckbox.checked;
            kbPanel.style.display = on ? '' : 'none';
            if (on && !kbPanel.dataset.built) {

        // ToBI, Phonemic mode, and Advanced prosody are mutually exclusive
        // (per spec): turning one on disables the other two's checkboxes
        // until it's turned off again.
        function updateModeExclusivity() {
            const anyOn = tobiCheckbox.checked || phonemicCheckbox.checked || advancedCheckbox.checked;
            tobiCheckbox.disabled = anyOn && !tobiCheckbox.checked;
            phonemicCheckbox.disabled = anyOn && !phonemicCheckbox.checked;
            advancedCheckbox.disabled = anyOn && !advancedCheckbox.checked;
        }

        tobiCheckbox.addEventListener('change', () => {
            tobiRow.style.display = tobiCheckbox.checked ? '' : 'none';
            updateModeExclusivity();
        });

        phonemicCheckbox.addEventListener('change', () => {
            const on = phonemicCheckbox.checked;
            phonemicRows.style.display = on ? '' : 'none';
            input.disabled = on;
            updateModeExclusivity();
        });

        advancedCheckbox.addEventListener('change', () => {
            const on = advancedCheckbox.checked;
            advancedRows.style.display = on ? '' : 'none';
            input.style.display = on ? 'none' : '';
            input.disabled = on;
            updateModeExclusivity();
        });

        // --- Advanced prosody tag system ------------------------------------
        const advancedTags = new Map(); // 2-digit hex code -> tag object
        const TAG_COLORS = ['#e53935', '#8e24aa', '#3949ab', '#00897b', '#43a047', '#f9a825', '#fb8c00', '#6d4c41'];

        function randomTagCode() {
            let code, attempts = 0;
            do {
                code = Math.floor(Math.random() * 256).toString(16).padStart(2, '0').toUpperCase();
                attempts++;
            } while (advancedTags.has(code) && attempts < 1000);
            return code;
        }

        function defaultTagAttrs(type) {
            if (type === 'start') return { targetCode: '', mode: 'continuous' };
            if (type === 'target') return { mode: 'frequency', value: 220 };
            if (type === 'tone') return { mode: 'frequency', value: 220 };
            if (type === 'speed') return { mode: 'length', value: 110 };
            return {};
        }

        function createTag(type) {
            const code = randomTagCode();
            const tag = { code, type: type || 'tone', color: TAG_COLORS[advancedTags.size % TAG_COLORS.length], ...defaultTagAttrs(type || 'tone') };
            advancedTags.set(code, tag);
            return tag;
        }

        function insertTagMarkerAtCursor(tag) {
            const marker = document.createElement('span');
            marker.className = 'tag-marker';
            marker.contentEditable = 'false';
            marker.dataset.code = tag.code;
            marker.style.color = tag.color;
            marker.textContent = '\u200B';
            marker.title = `${tag.type} (${tag.code})`;
            marker.addEventListener('click', () => {
                renderTagMenu();
                const box = tagMenuContainer.querySelector(`.tag-menu-box[data-code="${tag.code}"]`);
                if (box) { box.style.outline = '2px solid ' + tag.color; setTimeout(() => { box.style.outline = ''; }, 800); }
            });

            const sel = window.getSelection();
            let range;
            if (sel && sel.rangeCount > 0 && ipaAdvanced.contains(sel.anchorNode)) {
                range = sel.getRangeAt(0);
            } else {
                range = document.createRange();
                range.selectNodeContents(ipaAdvanced);
                range.collapse(false);
            }
            range.deleteContents();
            range.insertNode(marker);
            range.setStartAfter(marker);
            range.setEndAfter(marker);
            sel.removeAllRanges();
            sel.addRange(range);
            ipaAdvanced.focus();
        }

        function refreshTagMarkerColors() {
            for (const marker of ipaAdvanced.querySelectorAll('.tag-marker')) {
                const tag = advancedTags.get(marker.dataset.code);
                if (tag) { marker.style.color = tag.color; marker.title = `${tag.type} (${tag.code})`; }
            }
        }

        function buildTagMenuBox(tag) {
            const box = document.createElement('div');
            box.className = 'tag-menu-box';
            box.dataset.code = tag.code;
            box.style.borderColor = tag.color;

            const titleRow = document.createElement('div');
            titleRow.style.display = 'flex';
            titleRow.style.justifyContent = 'space-between';
            titleRow.style.alignItems = 'center';
            const title = document.createElement('strong');
            title.textContent = `Tag ${tag.code}`;
            titleRow.appendChild(title);
            const minBtn = document.createElement('button');
            minBtn.type = 'button';
            minBtn.className = 'play-btn';
            minBtn.style.padding = '0.1rem 0.4rem';
            minBtn.textContent = tag.minimized ? '▾' : '▴';
            minBtn.title = tag.minimized ? 'Expand' : 'Minimize';
            minBtn.addEventListener('click', () => { tag.minimized = !tag.minimized; renderTagMenu(); });
            titleRow.appendChild(minBtn);
            box.appendChild(titleRow);

            if (tag.minimized) return box;

            const hideLabel = document.createElement('label');
            hideLabel.style.display = 'flex';
            hideLabel.style.alignItems = 'center';
            hideLabel.style.gap = '0.3rem';
            const hideCheck = document.createElement('input');
            hideCheck.type = 'checkbox';
            hideCheck.checked = !!tag.hiddenOnInput;
            hideCheck.addEventListener('change', () => {
                tag.hiddenOnInput = hideCheck.checked;
                const marker = ipaAdvanced.querySelector(`.tag-marker[data-code="${tag.code}"]`);
                if (marker) marker.style.display = tag.hiddenOnInput ? 'none' : 'inline-block';
            });
            hideLabel.appendChild(hideCheck);
            hideLabel.appendChild(document.createTextNode('Hide on input'));
            box.appendChild(hideLabel);

            const typeLabel = document.createElement('label');
            typeLabel.textContent = 'Type';
            const typeSel = document.createElement('select');
            const TYPE_NAMES = { start: 'Start changing', target: 'Target change', tone: 'Set tone', speed: 'Set speed' };
            for (const t of ['start', 'target', 'tone', 'speed']) {
                const opt = document.createElement('option');
                opt.value = t; opt.textContent = TYPE_NAMES[t];
                if (t === tag.type) opt.selected = true;
                typeSel.appendChild(opt);
            }
            typeSel.addEventListener('change', () => {
                tag.type = typeSel.value;
                Object.assign(tag, defaultTagAttrs(tag.type));
                renderTagMenu();
            });
            typeLabel.appendChild(typeSel);
            box.appendChild(typeLabel);

            const colorLabel = document.createElement('label');
            colorLabel.textContent = 'Color';
            const colorInput = document.createElement('input');
            colorInput.type = 'color';
            colorInput.value = tag.color;
            colorInput.addEventListener('input', () => {
                tag.color = colorInput.value;
                box.style.borderColor = tag.color;
                refreshTagMarkerColors();
            });
            colorLabel.appendChild(colorInput);
            box.appendChild(colorLabel);

            if (tag.type === 'start') {
                const codeLabel = document.createElement('label');
                codeLabel.textContent = 'Target tag code';
                const codeInput = document.createElement('input');
                codeInput.type = 'text';
                codeInput.maxLength = 2;
                codeInput.value = tag.targetCode || '';
                codeInput.placeholder = 'e.g. A3';
                codeInput.addEventListener('input', () => {
                    tag.targetCode = codeInput.value.toUpperCase();
                    hint.textContent = hintText();
                });
                codeLabel.appendChild(codeInput);
                box.appendChild(codeLabel);

                const modeLabel = document.createElement('label');
                modeLabel.textContent = 'Mode';
                const modeSel = document.createElement('select');
                for (const m of ['continuous', 'step']) {
                    const opt = document.createElement('option'); opt.value = m; opt.textContent = m;
                    if (m === tag.mode) opt.selected = true;
                    modeSel.appendChild(opt);
                }
                modeSel.addEventListener('change', () => { tag.mode = modeSel.value; });
                modeLabel.appendChild(modeSel);
                box.appendChild(modeLabel);

                function hintText() {
                    if (!tag.targetCode) return 'Enter the code of a "Target change" tag';
                    const target = advancedTags.get(tag.targetCode);
                    if (!target) return `\u26A0 no tag with code ${tag.targetCode} found`;
                    if (target.type !== 'target') return `\u26A0 tag ${tag.targetCode} exists but isn't a "Target change" tag`;
                    return `\u2713 linked to target ${tag.targetCode}`;
                }
                const hint = document.createElement('div');
                hint.className = 'tag-hint';
                hint.textContent = hintText();
                box.appendChild(hint);
            } else if (tag.type === 'target' || tag.type === 'tone') {
                const modeLabel = document.createElement('label');
                modeLabel.textContent = 'Mode';
                const modeSel = document.createElement('select');
                for (const m of ['semitone', 'frequency', 'note']) {
                    const opt = document.createElement('option'); opt.value = m; opt.textContent = m;
                    if (m === tag.mode) opt.selected = true;
                    modeSel.appendChild(opt);
                }
                modeSel.addEventListener('change', () => {
                    tag.mode = modeSel.value;
                    tag.value = tag.mode === 'note' ? 'A4' : 220;
                    renderTagMenu();
                });
                modeLabel.appendChild(modeSel);
                box.appendChild(modeLabel);

                const valueLabel = document.createElement('label');
                valueLabel.textContent = tag.mode === 'semitone' ? 'Semitones (from the pitch at the start point)'
                    : tag.mode === 'frequency' ? 'Frequency (Hz)' : 'Note (e.g. A4, C#3)';
                const valueInput = document.createElement('input');
                if (tag.mode === 'note') {
                    valueInput.type = 'text';
                    valueInput.value = typeof tag.value === 'string' ? tag.value : 'A4';
                    valueInput.addEventListener('input', () => { tag.value = valueInput.value.trim(); });
                } else {
                    valueInput.type = 'number';
                    valueInput.value = typeof tag.value === 'number' ? tag.value : 0;
                    valueInput.addEventListener('input', () => { tag.value = parseFloat(valueInput.value); });
                }
                valueLabel.appendChild(valueInput);
                box.appendChild(valueLabel);
            } else if (tag.type === 'speed') {
                const modeLabel = document.createElement('label');
                modeLabel.textContent = 'Mode';
                const modeSel = document.createElement('select');
                const SPEED_MODE_NAMES = { length: 'Length (ms per phoneme)', pps: 'Phonemes per second', wpm: 'Words per minute (5-phoneme word)' };
                for (const m of ['length', 'pps', 'wpm']) {
                    const opt = document.createElement('option'); opt.value = m; opt.textContent = SPEED_MODE_NAMES[m];
                    if (m === tag.mode) opt.selected = true;
                    modeSel.appendChild(opt);
                }
                modeSel.addEventListener('change', () => { tag.mode = modeSel.value; renderTagMenu(); });
                modeLabel.appendChild(modeSel);
                box.appendChild(modeLabel);

                const valueLabel = document.createElement('label');
                valueLabel.textContent = tag.mode === 'length' ? 'Length (ms)' : tag.mode === 'pps' ? 'Phonemes/sec' : 'Words/min';
                const valueInput = document.createElement('input');
                valueInput.type = 'number';
                valueInput.value = typeof tag.value === 'number' ? tag.value : 110;
                valueInput.addEventListener('input', () => { tag.value = parseFloat(valueInput.value); });
                valueLabel.appendChild(valueInput);
                box.appendChild(valueLabel);
            }

            const delBtn = document.createElement('button');
            delBtn.textContent = 'Delete tag';
            delBtn.type = 'button';
            delBtn.className = 'play-btn';
            delBtn.style.marginTop = '0.6rem';
            delBtn.addEventListener('click', () => {
                const marker = ipaAdvanced.querySelector(`.tag-marker[data-code="${tag.code}"]`);
                if (marker) marker.remove();
                advancedTags.delete(tag.code);
                renderTagMenu();
            });
            box.appendChild(delBtn);

            return box;
        }

        // Renders every tag's menu at once, side by side. Each box has its
        // own minimize toggle (▴/▾) rather than one global switch.
        function renderTagMenu() {
            tagMenuContainer.innerHTML = '';
            if (advancedTags.size === 0) return;

            const row = document.createElement('div');
            row.className = 'tag-menus-row';
            for (const tag of advancedTags.values()) {
                row.appendChild(buildTagMenuBox(tag));
            }
            tagMenuContainer.appendChild(row);
        }

        insertTagBtn.addEventListener('click', () => {
            const tag = createTag('tone');
            insertTagMarkerAtCursor(tag);
            renderTagMenu();
        });

        // Converts one tag into the DSL directive token(s) it resolves to.
        // start/target tags reference each other by code and get resolved
        // into the actual pitch trajectory by sequencer.js's
        // computePitchTrajectories() pre-pass -- this just has to emit the
        // right directive tokens at the right position, not do the math.
        function tagToDirectiveTokens(tag) {
            if (tag.type === 'start') {
                if (!tag.targetCode) return '';
                // "T" prefix: a hex code like "95" is all-digits, so bare
                // [pitchStart=95] parses as the NUMERIC bracket form
                // (value: 95) instead of the string form (valueStr: "95")
                // that the trajectory lookup actually reads -- silently
                // breaking any all-digit code. Prefixing guarantees it's
                // never numeric-looking, on both ends consistently.
                // NOTE: this carries the TARGET's code (what this tag
                // points AT), not this tag's own code.
                return `[pitchStart=T${tag.targetCode}] [pitchStartMode=${tag.mode}]`;
            }
            if (tag.type === 'target') {
                const modeTok = `[pitchTargetMode=${tag.mode}]`;
                const valTok = tag.mode === 'note' ? `[pitchTargetNote=${tag.value}]` : `[pitchTargetValue=${tag.value}]`;
                // This carries the target tag's OWN code, so a start tag
                // elsewhere can find it.
                return `[pitchTarget=T${tag.code}] ${modeTok} ${valTok}`;
            }
            if (tag.type === 'tone') {
                if (tag.mode === 'semitone') return `[semitone=${tag.value}]`;
                if (tag.mode === 'frequency') return `[base=${tag.value}]`;
                if (tag.mode === 'note') return `b=${tag.value}`;
            }
            if (tag.type === 'speed') {
                // [rate=X] gets immediately overwritten by the very next
                // word-chunk's own "r100"/"r150" wrapping (every word
                // resets rate on its own) -- localSpeed is a SEPARATE
                // runtime multiplier that chunk-wrapping never touches, so
                // it survives across word boundaries. 110 = DEFAULTS.rate.
                const ms = tag.mode === 'length' ? tag.value : tag.mode === 'pps' ? 1000 / tag.value : 12000 / tag.value;
                return `[localSpeed=${(110 / ms).toFixed(6)}]`;
            }
            return '';
        }

        // Walks the contenteditable's child nodes in document order,
        // alternating plain-IPA text spans (converted through the normal
        // pipeline, with prosody marks suppressed) and tag markers
        // (resolved directly into DSL directive tokens, bypassing the IPA
        // converter entirely since they're not IPA).
        function compileAdvancedProsody() {
            const segments = [];
            let buffer = '';
            const flush = () => { if (buffer.trim()) segments.push({ kind: 'ipa', text: buffer }); buffer = ''; };
            for (const node of ipaAdvanced.childNodes) {
                if (node.nodeType === Node.TEXT_NODE) {
                    buffer += node.textContent;
                } else if (node.classList && node.classList.contains('tag-marker')) {
                    flush();
                    const tag = advancedTags.get(node.dataset.code);
                    if (tag) segments.push({ kind: 'directive', text: tagToDirectiveTokens(tag) });
                } else {
                    buffer += node.textContent || '';
                }
            }
            flush();

            const unmatched = [];
            SUPPRESS_TONE_PROSODY = true;
            try {
                const out = segments.map(s => s.kind === 'directive' ? s.text : expandProsodyMarkup(s.text, unmatched));
                return { phonemeString: out.filter(Boolean).join(' '), unmatched };
            } finally {
                SUPPRESS_TONE_PROSODY = false;
            }
        }

        speedSlider.addEventListener('input', () => {
            speedValue.textContent = `${Number(speedSlider.value).toFixed(2)}×`;
        });
        glideSpeedSlider.addEventListener('input', () => {
            glideSpeedValue.textContent = `${Number(glideSpeedSlider.value).toFixed(2)}×`;
        });

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.classList.toggle('error', isError);
        }

        // Shared by Play and Download WAV: turns whatever's in the active
        // input mode (plain / phonemic / ToBI / advanced) into a phoneme
        // string ready for the synth. Returns null (after setting an error
        // status) if there's nothing playable yet.
        function compilePlayback() {
            let raw = input.value;
            let phonemicNote = '';
            let phonemeString, unmatched;

            if (advancedCheckbox.checked) {
                ({ phonemeString, unmatched } = compileAdvancedProsody());
                if (!phonemeString) {
                    setStatus('Type some IPA text first.', true);
                    return null;
                }
                raw = phonemeString; // for the status-line [] label below
            } else {

            if (phonemicCheckbox.checked) {
                const phonemicText = phonemicInput.value;
                if (!phonemicText || !phonemicText.trim()) {
                    setStatus('Type the phonemic form first.', true);
                    return null;
                }
                const { result, warnings } = applySoundChanges(phonemicText, soundChangesInput.value);
                if (warnings.length) console.warn(warnings.join('; '));
                if (!result.trim()) {
                    setStatus('Sound changes produced an empty result.', true);
                    return null;
                }
                raw = result;
                phonemicNote = `/${phonemicText.trim()}/ → `;
            }

            if (!raw || !raw.trim()) {
                setStatus('Type some IPA text first.', true);
                return null;
            }

            if (tobiCheckbox.checked) {
                // IPA phrases are separated by "%" (ToBI's own boundary-tone
                // symbol, reused here as the phrase divider); the tone tier
                // is separated by "|", one section per IPA phrase. Phrases
                // are rejoined with "." so each one is also its own
                // sentence for the sequencer's contour engine.
                const ipaPhrases = raw.split('%').map(s => s.trim()).filter(Boolean);
                const tobiPhrases = tobiInput.value.split('|').map(s => s.trim());
                if (tobiInput.value.trim() && tobiPhrases.length !== ipaPhrases.length) {
                    console.warn(`ToBI has ${tobiPhrases.length} section(s) separated by "|" but the IPA has ${ipaPhrases.length} section(s) separated by "%" -- extra sections on either side are ignored.`);
                }
                const allUnmatched = [];
                const tobiWarnings = [];
                const phraseStrings = ipaPhrases.map((phraseText, i) => {
                    const { chunks, unmatched: phraseUnmatched } = ipaPhraseToChunks(phraseText);
                    allUnmatched.push(...phraseUnmatched);
                    const toneStr = tobiPhrases[i];
                    return toneStr ? applyTobiToPhrase(chunks, toneStr, tobiWarnings) : chunks.map(c => c.output).join(' ');
                });
                if (tobiWarnings.length) console.warn(tobiWarnings.join('; '));
                phonemeString = phraseStrings.filter(Boolean).join(' . ');
                unmatched = allUnmatched;
            } else {
                const markupUnmatched = [];
                phonemeString = expandProsodyMarkup(raw, markupUnmatched);
                unmatched = markupUnmatched;
            }

            } // end of "not advanced mode" branch

            if (!phonemeString) {
                setStatus('No recognizable IPA symbols found.', true);
                return null;
            }

            const allophonicLabel = `${phonemicNote}[${raw.trim()}]`;
            return { phonemeString, unmatched, raw, allophonicLabel };
        }

        async function playIpa() {
            const compiled = compilePlayback();
            if (!compiled) return;
            const { phonemeString, unmatched, allophonicLabel } = compiled;

            if (unmatched.length) {
                setStatus(`Playing ${allophonicLabel} (skipped unknown: ${unmatched.join(' ')})`);
            } else {
                setStatus(`Playing ${allophonicLabel}`);
            }

            button.disabled = true;
            button.classList.add('playing');

            try {
                if (typeof speak !== 'function') {
                    throw new Error('speak() is not defined yet — wire it up in src/main.js.');
                }
                // NOTE: main.js's speak() needs to forward these options into
                // compileString(phonemeString, opts) (sequencer.js) -- that's
                // where they actually scale the schedule. `speed` only moves
                // WHEN phonemes happen (pacing/holds/pauses); `glideSpeed` only
                // affects how fast transitions/diphthong glides move, kept
                // independent so speeding up talking pace doesn't also speed
                // up how fast the mouth physically glides between sounds.
                await speak(phonemeString, {
                    speed: Number(speedSlider.value),
                    glideSpeed: Number(glideSpeedSlider.value),
                });
            } catch (err) {
                setStatus(err.message || 'Playback failed.', true);
            } finally {
                button.disabled = false;
                button.classList.remove('playing');
            }
        }

        // Turns an utterance's raw IPA text into a safe .wav filename.
        // Modern filesystems handle Unicode fine, so this keeps the actual
        // IPA characters (readable, e.g. "he.ˈloʊ-ˈðɛɚ.wav") rather than
        // collapsing them to ASCII -- it only strips characters that are
        // genuinely illegal in filenames (Windows' reserved set covers
        // macOS/Linux's smaller one too) and whitespace.
        function filenameFor(raw) {
            const cleaned = (raw || '')
                .replace(/[\\/:*?"<>|]/g, '')
                .replace(/\s+/g, '-')
                .replace(/^[-.]+|[-.]+$/g, '')
                .slice(0, 60);
            return `${cleaned || 'utterance'}.wav`;
        }

        async function downloadWav() {
            const compiled = compilePlayback();
            if (!compiled) return;
            const { phonemeString, unmatched, raw, allophonicLabel } = compiled;

            if (unmatched.length) {
                setStatus(`Rendering ${allophonicLabel} (skipped unknown: ${unmatched.join(' ')})`);
            } else {
                setStatus(`Rendering ${allophonicLabel}`);
            }

            downloadBtn.disabled = true;
            downloadBtn.classList.add('playing');

            try {
                if (typeof renderWav !== 'function') {
                    throw new Error('renderWav() is not defined yet — wire it up in src/main.js.');
                }
                const { bytes } = await renderWav(phonemeString, {
                    speed: Number(speedSlider.value),
                    glideSpeed: Number(glideSpeedSlider.value),
                });
                const blob = new Blob([bytes], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filenameFor(raw);
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 2000);
                setStatus(`Downloaded ${allophonicLabel}`);
            } catch (err) {
                setStatus(err.message || 'Could not render WAV.', true);
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('playing');
            }
        }

        button.addEventListener('click', playIpa);
        downloadBtn.addEventListener('click', downloadWav);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') playIpa();
        });
    </script>
</body>
</html>
